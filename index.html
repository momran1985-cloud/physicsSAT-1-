<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة التحصيلي — الاستعداد للاختبار المبكر (فيزياء)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10264a; --ink2:#34476b; --paper:#f6f3e9; --card:#ffffff; --line:#dcd6c3;
  --teal:#0e7c86; --teal-d:#0a5c64; --amber:#f59e0b; --ok:#15803d; --okbg:#e7f6ec; --bad:#b91c1c; --badbg:#fdeaea;
  --r:16px; --shadow:0 6px 22px rgba(16,38,74,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);background:var(--paper);
  background-image:linear-gradient(rgba(14,124,134,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(14,124,134,.07) 1px,transparent 1px);
  background-size:28px 28px;line-height:1.7;min-height:100vh}
button{font-family:inherit;cursor:pointer}
bdi{unicode-bidi:isolate}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.btn{border:0;border-radius:12px;padding:11px 20px;font-size:1rem;font-weight:700;background:var(--teal);color:#fff;transition:transform .12s,background .15s,box-shadow .15s;box-shadow:0 3px 0 var(--teal-d)}
.btn:hover{background:#0b6e77}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal-d)}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);border:1.5px solid var(--line)}
.btn.sec:hover{background:#fbf9f1}
.btn.amber{background:var(--amber);color:#3b2600;box-shadow:0 3px 0 #b97800}
.btn.red{background:var(--bad);box-shadow:0 3px 0 #7f1212}
.btn.sm{padding:7px 14px;font-size:.9rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.top{background:var(--ink);color:#fff;border-radius:0 0 22px 22px;padding:14px 16px;margin:0 -16px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
.top .brand b{font-size:1.1rem;font-weight:800}
.top .brand small{display:block;opacity:.75;font-size:.8rem;font-weight:400}
.chip{background:rgba(255,255,255,.14);padding:5px 12px;border-radius:99px;font-size:.88rem}
h1,h2,h3{margin:0 0 8px;line-height:1.35}
/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:center;min-height:calc(100vh - 32px)}
.hero{padding:10px 6px}
.hero .tag{display:inline-block;background:var(--ink);color:#fff;border-radius:99px;padding:4px 14px;font-size:.85rem;margin-bottom:12px}
.hero h1{font-size:2.1rem;font-weight:800}
.hero h1 span{color:var(--teal)}
.hero p{color:var(--ink2);font-size:1.02rem;max-width:520px}
.hero svg{width:100%;max-width:470px;margin-top:8px}
.hero .trace{stroke-dasharray:640;stroke-dashoffset:640;animation:draw 3.2s .3s ease forwards}
.hero .dot{offset-path:path('M20 150 C 90 150, 120 140, 170 100 S 260 20, 330 20');animation:go 3.2s .3s ease forwards;offset-distance:0%}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes go{to{offset-distance:100%}}
.form{padding:26px}
.form h2{font-size:1.4rem}
label{display:block;font-weight:700;margin:14px 0 5px}
input[type=text],input[type=tel]{width:100%;font:inherit;padding:12px 14px;border:1.8px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus{outline:3px solid rgba(14,124,134,.25);border-color:var(--teal)}
.hint{font-size:.85rem;color:var(--ink2)}
.err{color:var(--bad);font-weight:700;margin-top:10px;min-height:1.4em}
/* home */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{padding:12px 14px;text-align:center}
.stat b{display:block;font-size:1.6rem;font-weight:800;color:var(--teal)}
.stat span{font-size:.85rem;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.scard{padding:16px 18px;position:relative;overflow:hidden;border-top:6px solid var(--c)}
.scard .num{position:absolute;left:12px;top:4px;font-size:3.6rem;font-weight:800;color:var(--c);opacity:.13;line-height:1}
.scard h3{font-size:1.08rem;padding-left:44px}
.sum{margin:0 0 10px;background:#f6f9fc;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:.88rem}.sum summary{cursor:pointer;font-weight:700;color:var(--ink)}.sum ul{margin:6px 0 2px;padding-inline-start:18px;line-height:1.7}.exm{margin:6px 0;line-height:1.7}.eq{direction:ltr;text-align:center;background:#fff;border:1px dashed #9db4d3;border-radius:8px;padding:6px 8px;margin:4px 0;font-family:"Cambria Math","Times New Roman",serif;font-size:1rem;color:#10264a;overflow-x:auto;white-space:nowrap}
.scard .meta{color:var(--ink2);font-size:.88rem;margin-bottom:10px}
.scard .row{display:flex;gap:8px;flex-wrap:wrap}
.scard .best{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.pill{font-size:.78rem;padding:2px 10px;border-radius:99px;background:#eef3f4;color:var(--ink2);border:1px solid var(--line)}
.pill.good{background:var(--okbg);color:var(--ok);border-color:#b7e1c4}
.final{margin-top:14px;padding:20px;background:linear-gradient(135deg,var(--ink),#1c3d78);color:#fff;border:0;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.final h3{font-size:1.3rem;margin:0}.final p{margin:2px 0 0;opacity:.85}
.final .grow{flex:1;min-width:220px}
.foot{margin:22px 0 8px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.credit{text-align:center;color:var(--ink2);font-size:.88rem;margin:10px 0 24px}
.credit a{color:var(--teal);font-weight:700;text-decoration:none}
/* quiz */
.qbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qbar .t{font-weight:800;flex:1;min-width:180px}
.timer{font-variant-numeric:tabular-nums;direction:ltr;background:var(--ink);color:#fff;padding:3px 12px;border-radius:99px;font-weight:700}
.timer.low{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.prog{height:9px;background:#e4dfcc;border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--c,var(--teal));border-radius:99px;transition:width .35s}
.qcard{padding:20px}
.qcard.in{animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.qn{display:inline-block;background:var(--c,var(--teal));color:#fff;border-radius:8px;padding:0 10px;font-weight:800;margin-bottom:8px;font-size:.9rem}
.qt{font-size:1.2rem;font-weight:700;margin-bottom:12px}
.fig{background:#fffdf6;border:1px dashed var(--line);border-radius:12px;padding:8px;margin:6px 0 14px;max-width:440px}
.fig svg{width:100%;height:auto;direction:ltr;display:block}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;width:100%;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 14px;font-size:1.05rem;color:var(--ink);transition:border-color .12s,background .12s,transform .1s}
.opt:hover{border-color:var(--teal);background:#f3fafb}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;background:#eef3f4;display:grid;place-items:center;font-weight:800}
.opt.sel{border-color:var(--teal);background:#e6f5f6}.opt.sel .l{background:var(--teal);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .l{background:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:var(--badbg)}.opt.no .l{background:var(--bad);color:#fff}
.opt.lock{pointer-events:none}
.fb{margin-top:14px;border-radius:14px;padding:13px 16px;animation:in .3s}
.fb.ok{background:var(--okbg);border:1.5px solid #9ed3ae}.fb.no{background:var(--badbg);border:1.5px solid #eeb0b0}
.fb b.h{display:block;font-size:1.05rem;margin-bottom:2px}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dots button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--ink)}
.dots button.done{background:#d9eef0;border-color:var(--teal)}
.dots button.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
/* result */
.res{padding:24px;text-align:center}
.ring{width:170px;height:170px;margin:4px auto 6px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;font-size:2.2rem;font-weight:800}
.ring .c small{display:block;font-size:.85rem;font-weight:500;color:var(--ink2);margin-top:-8px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.kv div{background:#f4f1e6;border-radius:12px;padding:8px}.kv b{display:block;font-size:1.25rem}.kv span{font-size:.82rem;color:var(--ink2)}
.msg{font-size:1.15rem;font-weight:700;margin:8px 0}
.medal{display:inline-flex;align-items:center;gap:8px;background:#fff6dd;border:1.5px solid #f0cf72;color:#7a5200;padding:6px 16px;border-radius:99px;font-weight:800;margin:6px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.rv{margin-top:18px;text-align:right}
.rvi{padding:14px 16px;margin-bottom:10px;border-right:6px solid var(--line)}
.rvi.ok{border-right-color:var(--ok)}.rvi.no{border-right-color:var(--bad)}
.rvi .q{font-weight:700;margin-bottom:6px}
.rvi .ans{font-size:.95rem}
.rvi .ex{margin-top:6px;color:var(--ink2);font-size:.95rem}
.tag2{display:inline-block;font-size:.78rem;padding:1px 9px;border-radius:99px;margin-left:6px;font-weight:700}
.tag2.ok{background:var(--okbg);color:var(--ok)}.tag2.no{background:var(--badbg);color:var(--bad)}.tag2.sk{background:#eee;color:#555}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,24,48,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:18px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:in .25s}
.modal h3{font-size:1.25rem}
.modal ul{padding-right:20px;margin:8px 0}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:12px 0}
.chk input{width:20px;height:20px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;z-index:90;font-weight:700;animation:in .25s}
/* certificate */
#cert{display:none}
#cert.show{display:block;position:fixed;inset:0;z-index:80;background:rgba(10,24,48,.7);overflow:auto;padding:16px}
.certbox{max-width:900px;margin:0 auto}
.certbar{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
.cpage{background:#fffdf5;border:14px double #b8892b;padding:34px 40px;text-align:center;color:#2a2210;position:relative;min-height:520px;display:flex;flex-direction:column;justify-content:center}
.cpage h1{font-size:2.6rem;color:#8a5f00;margin:0 0 6px;font-weight:800}
.cpage .nm{font-size:2.1rem;font-weight:800;border-bottom:2px solid #b8892b;display:inline-block;padding:0 26px;margin:8px auto 14px;color:var(--ink)}
.cpage p{font-size:1.15rem;margin:6px 0}
.cpage .sig{display:flex;justify-content:space-around;margin-top:26px;font-size:1rem}
.cpage .sig div{min-width:200px;border-top:1.5px solid #8a7a50;padding-top:6px}
@media print{
  body{background:#fff!important}
  body>*:not(#cert){display:none!important}
  #cert.show{position:static;background:none;padding:0;overflow:visible}
  .certbar{display:none}
  .cpage{min-height:0;height:182mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:10mm}
}
@media(max-width:720px){
  .login{grid-template-columns:1fr;min-height:0;padding-top:10px}
  .hero h1{font-size:1.6rem}
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .qt{font-size:1.08rem}
  .kv{grid-template-columns:repeat(3,1fr)}
  .cpage{padding:20px 14px}.cpage h1{font-size:1.8rem}.cpage .nm{font-size:1.4rem}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="cert"></div>
<script>
const M=(q,c,w,e)=>({q,o:[c,...w],e});
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[R(0,a.length-1)];
const f=x=>String(+(+x).toFixed(3));
const fm=x=>f(x).replace('-','−');
/* GN: سؤال رقمي — c الجواب الصحيح، cands قائمة مشتتات منطقية (أخطاء شائعة)، e التفسير، u الوحدة. يقبل القيم السالبة والصفر */
const GN=(q,c,cands,e,u)=>{const sfx=u?' '+u:'';const seen=new Set([fm(c)]),w=[];
  for(const x of cands){const s=fm(x);if(isFinite(x)&&!seen.has(s)){seen.add(s);w.push(s)}}
  for(let k=1;w.length<3&&k<80;k++){const st=Math.abs(c)>=20?Math.round(Math.abs(c)*0.1):(Math.abs(c)>=2?1:0.5);for(const sg of [1,-1]){const s=fm(c+sg*k*st);if(w.length<3&&!seen.has(s)){seen.add(s);w.push(s)}}}
  return M(q,fm(c)+sfx,w.slice(0,3).map(s=>s+sfx),e)};
const GQ=GN;
/* WS: إضافة شكل SVG إلى سؤال   WS(FIG.incline({...}), M(...))   |   WG: إضافة رسم بياني خطي  WG({L:[{p:[[0,0],[2,10]],n:'A'}],xl:'الزمن (s)',yl:'السرعة (m/s)'}, M(...)) */
const WS=(svg,q)=>Object.assign(q,{svg});
const WG=(g,q)=>Object.assign(q,{g});
/* ===== مكتبة الأشكال (SVG) — كل دالة ترجع نص SVG يوضع في الخاصية svg للسؤال ===== */
const INK='#10264a',ORG='#e8590c',TEAL='#0e7c86',GRY='#8a93a6';
const _svg=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="شكل توضيحي للسؤال" style="max-width:${Math.min(w,440)}px;width:100%;direction:ltr"><defs>${[['ah',INK],['ao',ORG],['at',TEAL],['ag',GRY]].map(([i,c])=>`<marker id="${i}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join('')}</defs>${inner}</svg>`;
const _t=(x,y,s,o={})=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${o.s||13}" font-weight="${o.w||700}" fill="${o.c||INK}" text-anchor="${o.a||'middle'}" font-family="Tajawal,Arial,sans-serif">${s}</text>`;
const _ln=(x1,y1,x2,y2,c,w,extra)=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c||INK}" stroke-width="${w||2}" ${extra||''}/>`;
const _MK={[INK]:'ah',[ORG]:'ao',[TEAL]:'at',[GRY]:'ag'};
/* سهم من (x,y) باتجاه الزاوية ang (درجات، 0 = يمين، 90 = أعلى) وطول len، مع نص label بجانب الرأس */
const _arrow=(x,y,ang,len,c,label,o={})=>{const a=ang*Math.PI/180,dx=Math.cos(a),dy=-Math.sin(a),x2=x+dx*len,y2=y+dy*len;
  const lx=x2+dx*(o.d||14)+(o.dx||0),ly=y2+dy*(o.d||14)+4+(o.dy||0);
  return _ln(x,y,x2,y2,c,2.6,`marker-end="url(#${_MK[c]||'ah'})"`)+(label?_t(lx,ly,label,{c,s:o.s||14,a:o.a||(dx>0.35?'start':dx<-0.35?'end':'middle')}):'')};
const FIG={};
/* ===== مستوى مائل: FIG.incline({ang:30, w:'mg', n:'N', f:'f', fdir:'up'|'down', comps:true, F:'F', Fang:0}) ===== */
FIG.incline=(o={})=>{const ang=o.ang||30,r=ang*Math.PI/180,W=380,H=230;const Lx=Math.min(280,150/Math.tan(r)),B=[340,200],A=[B[0]-Lx,200],C=[340,200-Lx*Math.tan(r)];
  const u=[Math.cos(r),-Math.sin(r)],n=[-Math.sin(r),-Math.cos(r)];const p0=[A[0]+(C[0]-A[0])*0.55,A[1]+(C[1]-A[1])*0.55],s=40;
  const q=(a,b)=>[p0[0]+u[0]*a+n[0]*b,p0[1]+u[1]*a+n[1]*b];const pts=[q(-s/2,0),q(s/2,0),q(s/2,s),q(-s/2,s)].map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
  const cb=q(0,s/2);let g=`<polygon points="${A} ${B} ${C}".replace(/,/g,' ') fill="#f1ede0" stroke="${INK}" stroke-width="2.4"/>`;
  g=`<polygon points="${A[0]},${A[1]} ${B[0]},${B[1]} ${C[0]},${C[1]}" fill="#f1ede0" stroke="${INK}" stroke-width="2.4"/>`;
  g+=`<polygon points="${pts}" fill="#cfe6e8" stroke="${TEAL}" stroke-width="2.4"/>`;
  const arc=34;g+=`<path d="M ${A[0]+arc} ${A[1]} A ${arc} ${arc} 0 0 0 ${A[0]+arc*Math.cos(r)} ${A[1]-arc*Math.sin(r)}" fill="none" stroke="${INK}" stroke-width="1.6"/>`+_t(A[0]+arc+14,A[1]-8,o.angLabel||ang+'°',{s:13});
  const L=o.len||58;
  if(o.w!==undefined&&o.w!==false)g+=_arrow(cb[0],cb[1],-90,L,ORG,o.w===true?'mg':o.w,{d:12});
  if(o.n)g+=_arrow(cb[0],cb[1],90+ang,L*0.9,TEAL,o.n===true?'N':o.n,{d:12});
  if(o.f)g+=_arrow(cb[0],cb[1],o.fdir==='down'?180+ang:ang,L*0.6,INK,o.f===true?'f':o.f,{d:12});
  if(o.F)g+=_arrow(cb[0],cb[1],(o.Fang===undefined?ang:ang+o.Fang),L*0.9,INK,o.F===true?'F':o.F,{d:12});
  if(o.comps){const wl=L;
    g+=_ln(cb[0],cb[1],cb[0]-u[0]*wl*Math.sin(r),cb[1]-u[1]*wl*Math.sin(r),GRY,2,'stroke-dasharray="5 4" marker-end="url(#ag)"');
    g+=_ln(cb[0],cb[1],cb[0]-n[0]*wl*Math.cos(r),cb[1]-n[1]*wl*Math.cos(r),GRY,2,'stroke-dasharray="5 4" marker-end="url(#ag)"');
    g+=_t(cb[0]-u[0]*wl*Math.sin(r)-6,cb[1]-u[1]*wl*Math.sin(r)+16,o.c1||'mg sinθ',{c:GRY,s:12,a:'end'})+_t(cb[0]-n[0]*wl*Math.cos(r)+10,cb[1]-n[1]*wl*Math.cos(r)+18,o.c2||'mg cosθ',{c:GRY,s:12,a:'start'})}
  if(o.h)g+=_t(B[0]+4,(B[1]+C[1])/2,o.h,{a:'start'});
  if(o.len2)g+=_t((A[0]+B[0])/2,B[1]+18,o.len2);
  return _svg(W,H,g)};
/* ===== مخطط الجسم الحر: FIG.fbd([{a:90,t:'N',len:60}, ...], {box:'m'}) — a بالدرجات (0 يمين، 90 أعلى) ===== */
FIG.fbd=(items,o={})=>{const W=360,H=240,cx=180,cy=120;let g=`<rect x="${cx-28}" y="${cy-20}" width="56" height="40" rx="4" fill="#cfe6e8" stroke="${TEAL}" stroke-width="2.4"/>`+_t(cx,cy+5,o.box||'m',{s:14});
  items.forEach(it=>{const c=it.c||(it.a===-90?ORG:it.a===90?TEAL:INK);const a=it.a*Math.PI/180;const sx=cx+Math.cos(a)*(Math.abs(Math.cos(a))>0.7?28:Math.abs(Math.sin(a))>0.7?20:30),sy=cy-Math.sin(a)*(Math.abs(Math.sin(a))>0.7?20:20);
    g+=_arrow(sx,sy,it.a,it.len||60,c,it.t,{d:14});});
  return _svg(W,H,g)};
/* ===== رافعة/عارضة: FIG.beam({len:6,pivot:2,forces:[{x:0,t:'20 N',up:false}],marks:[{x1:0,x2:2,t:'2 m'}],weight:'5 N'}) — x بالوحدات على العارضة ===== */

 'البادئات: nano = 10⁻⁹ ، micro = 10⁻⁶ ، milli = 10⁻³ ، centi = 10⁻² ، kilo = 10³ ، mega = 10⁶ ، giga = 10⁹. والتحويل: 1 km/h = 1/3.6 m/s.',
 'الكمية القياسية لها مقدار فقط (الزمن، الكتلة، الطاقة)، والمتجهة لها مقدار واتجاه (الإزاحة، السرعة المتجهة، القوة). المتجهان المتعامدان: R = √(A² + B²).',
 'الدقة تقارب القراءات من بعضها، والضبط قرب القياس من القيمة الحقيقية. في الضرب والقسمة يُقرَّب الناتج إلى أقل عدد أرقام معنوية. ميل الرسم = التغير في y÷التغير في x، والمساحة تحت المنحنى = حاصل ضرب المحورين.'];
EX.s1=['مثال 1: حوّل سرعة 72 km/h إلى m/s.','§v = 72 × 1000 m / 3600 s = 72 / 3.6','الحل: v = 20 m/s',
 'مثال 2: تؤثر قوة 600 N على مساحة 0.03 m². احسب الضغط.','§P = F / A','الحل: P = 600 / 0.03 = 20 000 Pa',
 'مثال 3: احسب 2.4 × 3.14 بعدد الأرقام المعنوية الصحيحة (2.4 له رقمان معنويان).','§2.4 × 3.14 = 7.536','الحل: يُقرَّب إلى رقمين معنويين فيكون الناتج 7.5'];

SUM.s2=['المسافة كمية قياسية تساوي طول المسار الكلي، أما الإزاحة فكمية متجهة تساوي التغير في الموضع من البداية إلى النهاية.',
 'السرعة المتجهة المتوسطة = الإزاحة ÷ الزمن، وهي متجهة وقد تساوي صفراً إذا عاد الجسم إلى نقطة البداية.',
 'السرعة المتوسطة = المسافة الكلية ÷ الزمن الكلي، وهي قياسية ولا تساوي صفراً أثناء الحركة.',
 'في منحنى (الموقع–الزمن) ميل الخط المستقيم يمثل السرعة المتجهة؛ ميل موجب يعني حركة في الاتجاه الموجب، وميل سالب عكس ذلك، وخط أفقي يعني السكون.'];
EX.s2=['مثال 1: يمشي طالب 30 m شرقاً ثم 40 m شمالاً. احسب المسافة ومقدار الإزاحة.','§d = 30 + 40 = 70 m ،  Δx = √(30² + 40²)','الحل: المسافة = 70 m ، مقدار الإزاحة = √2500 = 50 m',
 'مثال 2: تحركت سيارة من الموضع x = 20 m إلى x = 80 m خلال 12 s. احسب سرعتها المتجهة المتوسطة.','§v = Δx / Δt = (80 − 20) / 12','الحل: v = 60 / 12 = 5 m/s',
 'مثال 3: يركض عداء دورة كاملة حول مضمار طوله 400 m خلال 80 s. احسب سرعته المتوسطة وسرعته المتجهة المتوسطة.','§سرعته المتوسطة = d / t = 400 / 80','الحل: السرعة المتوسطة = 5 m/s ، أما الإزاحة = 0 فالسرعة المتجهة المتوسطة = 0'];

NEW.s3=[
 ()=>{const v0=R(2,10),a=R(1,5),t=R(2,8),v=v0+a*t;return GN(`جسم سرعته الابتدائية ${v0} m/s يتسارع بانتظام بتسارع ${a} m/s² لمدة ${t} s. سرعته النهائية:`,v,[a*t,v0+a+t,v0*a*t],`v = v₀ + at = ${v0} + ${a}×${t} = ${v} m/s.`,'m/s')},
 ()=>{const t=2*R(1,4),v0=R(1,8),a=R(1,5),d=v0*t+a*t*t/2;return GN(`جسم سرعته الابتدائية ${v0} m/s وتسارعه الثابت ${a} m/s². إزاحته خلال ${t} s:`,d,[v0*t+a*t*t,v0+a*t*t/2,a*t*t/2],`Δx = v₀t + ½at² = ${v0}×${t} + ½×${a}×${t}² = ${v0*t} + ${a*t*t/2} = ${d} m.`,'m')},
 ()=>{let v0,v,a;do{v0=R(2,6);v=v0+R(3,8);a=R(1,4)}while((v*v-v0*v0)%a!==0);const d=(v*v-v0*v0)/(2*a);return GN(`تزداد سرعة سيارة من ${v0} m/s إلى ${v} m/s بتسارع ثابت ${a} m/s². الإزاحة التي قطعتها:`,d,[(v*v-v0*v0)/a,(v-v0)/a,(v-v0)*a],`v² = v₀² + 2aΔx ⟹ Δx = (${v}² − ${v0}²)/(2×${a}) = ${v*v-v0*v0}/${2*a} = ${d} m.`,'m')},
 ()=>{const v0=P([10,20,30,40]),a=P([2,5]),d=v0*v0/(2*a);return GN(`سيارة تسير بسرعة ${v0} m/s ضغط سائقها على الفرامل فتباطأت بانتظام بمعدل ${a} m/s² حتى توقفت. المسافة التي قطعتها حتى التوقف:`,d,[v0*v0/a,v0/(2*a),v0*a],`0 = v₀² + 2aΔx ⟹ Δx = v₀²/(2|a|) = ${v0}²/(2×${a}) = ${d} m.`,'m')},
 ()=>{const a=(R(0,1)?1:-1)*R(1,5),t=R(2,6),v0=R(30,40),v=v0+a*t;return GN(`تغيرت سرعة جسم من ${v0} m/s إلى ${v} m/s خلال ${t} s بتسارع ثابت. تسارعه:`,a,[Math.abs(a),(v+v0)/t,(v-v0)*t],`a = (v − v₀)/t = (${v} − ${v0})/${t} = ${a} m/s².`,'m/s²')},
 ()=>{const a=R(1,5),v0=R(0,5),t=R(2,5),v1=v0+a*t;return WG({L:[{p:[[0,v0],[t,v1]]}],xl:'الزمن (s)',yl:'السرعة (m/s)'},GN(`يبين الرسم سرعة جسم بدلالة الزمن. تسارع الجسم يساوي:`,a,[v1,a*t,v0+a],`التسارع = ميل منحنى (السرعة–الزمن) = (${v1} − ${v0})/${t} = ${a} m/s².`,'m/s²'))},
 ()=>{const V=2*R(2,6),t1=R(2,5),t2=R(2,5),d=V*t1/2+V*t2;return WG({L:[{p:[[0,0],[t1,V],[t1+t2,V]]}],xl:'الزمن (s)',yl:'السرعة (m/s)'},GN(`يبين الرسم حركة سيارة تتسارع من السكون ثم تسير بسرعة ثابتة. الإزاحة الكلية خلال ${t1+t2} s:`,d,[V*(t1+t2),V*t1/2,V*t2],`المساحة = ½×${t1}×${V} + ${t2}×${V} = ${V*t1/2} + ${V*t2} = ${d} m.`,'m'))},
 ()=>{const T=R(2,5),k=R(2,5),v0=T*k;return WG({L:[{p:[[0,v0],[T,0]]}],xl:'الزمن (s)',yl:'السرعة (m/s)'},GN(`يبين الرسم تغير سرعة جسم يتباطأ حتى يتوقف. تسارعه يساوي:`,-k,[k,-v0*T,-k/2],`a = Δv/Δt = (0 − ${v0})/${T} = −${k} m/s²؛ الإشارة السالبة تعني تباطؤاً لأن الحركة في الاتجاه الموجب.`,'m/s²'))},
 M('جسم يتحرك على خط مستقيم بتسارع ثابت، تغيرت سرعته من 4 m/s إلى 10 m/s خلال 5 s. إزاحته خلال هذه المدة:','35 m',['30 m','50 m','15 m'],'Δx = ½(v₀ + v)t = ½(4 + 10)×5 = 35 m.'),
 M('جسم يتحرك في الاتجاه السالب بسرعة −4 m/s وتسارعه −2 m/s². ماذا يحدث لمقدار سرعته؟','يزداد',['يقل','يبقى ثابتاً','يصبح صفراً فوراً'],'السرعة والتسارع في الاتجاه نفسه (كلاهما سالب) فيزداد مقدار السرعة رغم أن التسارع سالب.')
];
SUM.s3=['التسارع = معدل تغير السرعة: a = Δv/Δt ، ووحدته m/s². التسارع السالب مع سرعة موجبة يعني تباطؤاً.',
 'معادلات الحركة بتسارع ثابت: v = v₀ + at ، Δx = v₀t + ½at² ، v² = v₀² + 2aΔx ، Δx = ½(v₀ + v)t.',
 'اختر المعادلة التي لا تحتوي المجهول غير المطلوب: إن لم يُعطَ الزمن فاستخدم v² = v₀² + 2aΔx.',
 'في رسم (السرعة–الزمن): الميل = التسارع، والمساحة تحت المنحنى = الإزاحة. وفي رسم (الموقع–الزمن) يكون المنحنى قطعاً مكافئاً عند ثبات التسارع.',
 'يتباطأ الجسم إذا كان التسارع عكس اتجاه السرعة، ويتسارع إذا كان بالاتجاه نفسه.'];
EX.s3=['مثال 1: تبدأ سيارة من السكون بتسارع 2 m/s² لمدة 5 s. احسب سرعتها النهائية وإزاحتها.','§v = v₀ + at = 0 + 2×5','§Δx = v₀t + ½at² = 0 + ½×2×5²','الحل: v = 10 m/s ، Δx = 25 m',
 'مثال 2: تسير سيارة بسرعة 20 m/s وتتباطأ بمعدل 4 m/s² حتى تقف. احسب زمن التوقف والمسافة.','§t = (v − v₀)/a = (0 − 20)/(−4)','§Δx = v₀² / (2|a|) = 400 / 8','الحل: t = 5 s ، Δx = 50 m',
 'مثال 3: تزداد سرعة جسم من 6 m/s إلى 14 m/s خلال إزاحة 50 m. احسب التسارع.','§v² = v₀² + 2aΔx ⟹ a = (v² − v₀²)/(2Δx)','§a = (196 − 36)/100','الحل: a = 1.6 m/s²'];

NEW.s4=[
 ()=>{const t=R(2,6);return GN(`يسقط حجر من السكون سقوطاً حراً (g = 10 m/s²). سرعته بعد ${t} s:`,10*t,[10*t*t,5*t,10+t],`v = gt = 10×${t} = ${10*t} m/s.`,'m/s')},
 ()=>{const t=R(2,6);return GN(`تسقط كرة من السكون سقوطاً حراً (g = 10 m/s²). المسافة التي تقطعها في ${t} s:`,5*t*t,[10*t,10*t*t,5*t],`Δy = ½gt² = ½×10×${t}² = ${5*t*t} m.`,'m')},
 ()=>{const v=P([10,20,30,40]),h=v*v/20;return GN(`تسقط كرة من السكون من ارتفاع ${h} m (g = 10 m/s²، وأهمل مقاومة الهواء). سرعتها لحظة الارتطام بالأرض:`,v,[h*10,h*2,h*h],`v² = 2gh = 2×10×${h} = ${20*h} ⟹ v = ${v} m/s.`,'m/s')},
 ()=>{const v0=P([10,20,30,40]),H=v0*v0/20;return GN(`قُذف جسم رأسياً إلى أعلى بسرعة ${v0} m/s (g = 10 m/s²). أقصى ارتفاع يصله:`,H,[v0*v0/10,v0/10,v0*2],`عند القمة v = 0 ⟹ H = v₀²/(2g) = ${v0}²/20 = ${H} m.`,'m')},
 ()=>{const T=R(1,6),v0=T*10;return GN(`قُذف جسم رأسياً إلى أعلى بسرعة ${v0} m/s (g = 10 m/s²). الزمن اللازم للوصول إلى أقصى ارتفاع:`,T,[2*T,v0*10,T/2],`v = v₀ − gt = 0 ⟹ t = v₀/g = ${v0}/10 = ${T} s.`,'s')},
 ()=>{const T=R(1,5),v0=T*10;return GN(`قُذفت كرة رأسياً إلى أعلى بسرعة ${v0} m/s (g = 10 m/s²). الزمن الكلي حتى تعود إلى نقطة القذف:`,2*T,[T,4*T,v0/20],`زمن الصعود = v₀/g = ${T} s ويساويه زمن الهبوط ⟹ الزمن الكلي = ${2*T} s.`,'s')},
 ()=>{const T=R(1,4),v0=10*T,pts=[[0,v0],[T,0],[2*T,-v0]];return WG({L:[{p:pts}],xl:'الزمن (s)',yl:'السرعة (m/s)'},GN(`يبين الرسم سرعة جسم قُذف رأسياً إلى أعلى (الاتجاه الموجب إلى أعلى). أقصى ارتفاع بلغه الجسم يساوي:`,v0*T/2,[v0*T,v0*2*T/2,v0/T],`أقصى ارتفاع = مساحة المثلث فوق محور الزمن = ½×${T}×${v0} = ${v0*T/2} m.`,'m'))},
 ()=>{const T=R(1,4),v0=10*T,pts=[];for(let k=0;k<=8;k++){const t=k*T/4;pts.push([t,v0*t-5*t*t])}return WG({L:[{p:pts}],xl:'الزمن (s)',yl:'الارتفاع (m)'},GN(`يبين الرسم ارتفاع كرة قُذفت رأسياً من سطح الأرض بدلالة الزمن (g = 10 m/s²). سرعة قذفها الابتدائية تساوي:`,v0,[T,5*T,20*T],`قمة المنحنى عند t = ${T} s وهو زمن الصعود: v₀ = gt = 10×${T} = ${v0} m/s.`,'m/s'))},
 M('عند أقصى ارتفاع لجسم قُذف رأسياً إلى أعلى (دون مقاومة هواء) يكون:','سرعته صفر وتسارعه 10 m/s² إلى أسفل',['سرعته صفر وتسارعه صفر','سرعته 10 m/s وتسارعه صفر','سرعته صفر وتسارعه 10 m/s² إلى أعلى'],'عند القمة تنعدم السرعة لحظياً، لكن الجاذبية ما زالت تؤثر فالتسارع g = 10 m/s² إلى أسفل.'),
 M('يُسقَط حجران كتلتاهما 1 kg و5 kg من الارتفاع نفسه في الوقت نفسه دون مقاومة هواء. أيهما يصل إلى الأرض أولاً؟','يصلان معاً',['الحجر 5 kg','الحجر 1 kg','يعتمد على حجمهما فقط'],'تسارع السقوط الحر g لا يعتمد على الكتلة، فالزمن t = √(2h/g) واحد للحجرين.')
];
SUM.s4=['السقوط الحر حركة تحت تأثير الجاذبية وحدها بتسارع g = 10 m/s² (نحو الأسفل) ولا يعتمد على الكتلة عند إهمال مقاومة الهواء.',
 'من السكون: v = gt ، Δy = ½gt² ، v² = 2gh.',
 'الرمي لأعلى: v = v₀ − gt ، وعند القمة v = 0 فيكون زمن الصعود t = v₀/g وأقصى ارتفاع H = v₀²/(2g).',
 'زمن الصعود يساوي زمن الهبوط إلى نقطة القذف، وسرعة العودة تساوي v₀ في المقدار وتعاكسها في الاتجاه.',
 'في رسم (السرعة–الزمن) للسقوط الحر خط مستقيم ميله g، وفي رسم (الموقع–الزمن) قطع مكافئ.'];
EX.s4=['مثال 1: يسقط حجر من السكون سقوطاً حراً لمدة 3 s. احسب سرعته والمسافة المقطوعة.','§v = gt = 10×3','§Δy = ½gt² = ½×10×3²','الحل: v = 30 m/s ، Δy = 45 m',
 'مثال 2: قُذفت كرة رأسياً إلى أعلى بسرعة 20 m/s. احسب زمن الصعود وأقصى ارتفاع والزمن الكلي.','§t = v₀/g = 20/10 ،  H = v₀²/(2g) = 400/20','الحل: زمن الصعود = 2 s ، أقصى ارتفاع = 20 m ، الزمن الكلي = 4 s',
 'مثال 3: تُسقَط كرة من ارتفاع 80 m. احسب زمن وصولها إلى الأرض وسرعتها لحظة الارتطام.','§t = √(2h/g) = √(160/10)','§v = gt = 10×4','الحل: t = 4 s ، v = 40 m/s'];

/* ===== s7: الجاذبية وقوانين كبلر (10) ===== */
NEW.s7=[
()=>{const n=P([2,3,4]),k=R(2,6),F=k*n*n;return GN(`تؤثر كتلتان في بعضهما بقوة جذب مقدارها ${F} N. إذا زادت المسافة بين مركزيهما إلى ${n} أمثال ما كانت عليه مع بقاء الكتلتين ثابتتين، فكم تصبح قوة الجذب؟`,k,[F/n,F*n,F*n*n],`F ∝ 1/r²، فعند مضاعفة المسافة ${n} مرات تقل القوة إلى 1/${n*n}: F′ = ${F}/${n*n} = ${k} N.`,'N')},
()=>{const a=R(2,4),b=R(2,3),F0=R(2,6);return GN(`قوة الجذب بين جسمين تساوي ${F0} N. إذا تضاعفت كتلة أحدهما ${a} مرات ونقصت المسافة بين مركزيهما إلى 1/${b} من قيمتها، فكم تصبح القوة؟`,F0*a*b*b,[F0*a*b,F0*a/(b*b),F0*b*b],`F = Gm₁m₂/r²: تتضاعف القوة ${a} مرات بسبب الكتلة و ${b*b} مرات بسبب المسافة: F′ = ${F0} × ${a} × ${b*b} = ${F0*a*b*b} N.`,'N')},
()=>{const k=P([1,2,5]),g0=36,g=g0/((k+1)*(k+1));return GN(`تسارع الجاذبية على سطح كوكب يساوي ${g0} m/s². ما تسارع الجاذبية عند نقطة ترتفع عن سطحه مسافة h = ${k===1?'':k}R حيث R نصف قطر الكوكب؟`,g,[g0/k,g0/(k+1),g0/(k*k)],`المسافة عن المركز r = R + h = ${k+1}R، و g = GM/r² فتقل إلى 1/${(k+1)*(k+1)}: g = ${g0}/${(k+1)*(k+1)} = ${f(g)} m/s².`,'m/s²')},
M('تدور سفينة فضاء كتلتها m حول كوكب كتلته M في مدار دائري نصف قطره r. أي العلاقات الآتية تعطي سرعتها المدارية؟','v = √(GM/r)',['v = GM/r','v = √(GMm/r)','v = GM/r²'],'قوة الجذب تمثل القوة المركزية: GMm/r² = mv²/r فينتج v = √(GM/r)، وهي لا تعتمد على كتلة السفينة m.'),
()=>{const R6=P([0.9,1.6,2.5,3.6]),v=Math.sqrt(10*R6*1e6);return GN(`نصف قطر كوكب R = ${R6} ×10⁶ m وتسارع الجاذبية على سطحه g = 10 m/s². ما السرعة المدارية لقمر يدور قرب سطحه مباشرة؟`,v,[v*2,v/2,v*1.5],`قرب السطح mg = mv²/R فـ v = √(gR) = √(10 × ${R6}×10⁶) = √(${f(10*R6)}×10⁶) = ${v} m/s.`,'m/s')},
()=>{const n=P([4,9]),TA=R(1,3),TB=TA*Math.pow(n,1.5);return GN(`يدور كوكبان حول الشمس، ونصف قطر مدار الكوكب B يساوي ${n} أمثال نصف قطر مدار الكوكب A. إذا كانت الفترة المدارية للكوكب A تساوي ${TA} سنة، فما الفترة المدارية للكوكب B؟`,TB,[TA*n,TA*n*n,TA*Math.sqrt(n)],`قانون كبلر الثالث: T_B²/T_A² = (r_B/r_A)³ = ${n}³ = ${n*n*n}، فـ T_B/T_A = √${n*n*n} = ${Math.pow(n,1.5)} ومنه T_B = ${TB} سنة.`,'سنة')},
M('ينص قانون كبلر الأول على أن','مدار كل كوكب حول الشمس إهليلج تقع الشمس في إحدى بؤرتيه',['مدار كل كوكب دائرة تقع الشمس في مركزها','مدار كل كوكب إهليلج تقع الشمس في مركزه','الخط الواصل بين الكوكب والشمس يمسح مساحات متساوية في أزمنة متساوية'],'مدارات الكواكب إهليلجية (قطع ناقص) وتقع الشمس في إحدى بؤرتيه، أما المساحات المتساوية فهي قانون كبلر الثاني.'),
WS(FIG.orbit({pts:['A','B','C','D']}),M('يدور كوكب حول الشمس في المدار الإهليلجي المبيّن بالشكل. عند أي نقطة تكون سرعته أكبر ما يمكن؟','النقطة A',['النقطة B','النقطة C','النقطة D'],'النقطة A هي الأقرب إلى الشمس (الحضيض)، وبحسب قانون كبلر الثاني تكون سرعة الكوكب أكبر ما يمكن عند أقرب نقطة، وأقل ما يمكن عند الأبعد B.')),
WS(FIG.orbit({pts:['A','B'],shade:true}),M('في الشكل مساحتان مظللتان متساويتان يمسحهما الخط الواصل بين الكوكب والشمس، إحداهما قرب النقطة A والأخرى قرب B. ما العلاقة بين الزمنين اللذين يستغرقهما الكوكب لقطع القوسين المقابلين؟','الزمنان متساويان',['زمن القطاع عند A أطول من زمن القطاع عند B','زمن القطاع عند B أطول من زمن القطاع عند A','لا يمكن المقارنة دون معرفة كتلة الكوكب'],'قانون كبلر الثاني: يمسح الخط الواصل بين الكوكب والشمس مساحات متساوية في أزمنة متساوية، فالمساحتان المتساويتان تُقطعان في زمنين متساويين.')),
()=>{const v=R(2,5);return WS(FIG.orbit({pts:['A','B']}),GN(`في الشكل مدار كوكب حول الشمس، وبعده عن الشمس عند النقطة B يساوي 9 أمثال بعده عند النقطة A. إذا كانت سرعة الكوكب عند B تساوي ${v} km/s، فما سرعته عند A؟`,9*v,[v/9,3*v,81*v],`عند الحضيض والأوج تكون السرعة عمودية على نصف القطر، وحفظ الزخم الزاوي يعطي v_A r_A = v_B r_B، فـ v_A = ${v} × 9 = ${9*v} km/s.`,'km/s'))},
];
SUM.s7=['قانون نيوتن للجذب: F = Gm₁m₂/r²، حيث G = 6.67×10⁻¹¹ N·m²/kg²، والقوة طردية مع حاصل ضرب الكتلتين وعكسية مع مربع المسافة بين المركزين.','تسارع الجاذبية g = GM/r² (r البعد عن مركز الجسم)، ويقل مع الارتفاع؛ وعند ضعف المسافة عن المركز يصبح ربع قيمته.','السرعة المدارية لقمر في مدار دائري: v = √(GM/r)، وهي لا تعتمد على كتلة القمر، وتقل كلما زاد نصف قطر المدار.','قوانين كبلر: (1) المدارات إهليلجية والشمس في إحدى البؤرتين، (2) الخط الواصل بين الكوكب والشمس يمسح مساحات متساوية في أزمنة متساوية فتكون السرعة أكبر عند الحضيض وأقل عند الأوج، (3) T²/r³ ثابت لجميع الكواكب.','بالنسب: T₁²/T₂² = r₁³/r₂³؛ فإذا ضاعف نصف قطر المدار 4 مرات صارت الفترة 8 مرات.'];
EX.s7=['مثال 1: كتلتان 10 kg و 20 kg تفصل بين مركزيهما مسافة 2 m. احسب قوة الجذب بينهما.','§F = G m₁ m₂ / r² = (6.67×10⁻¹¹ × 10 × 20) / 2²','الحل: F = 1.334×10⁻⁸ / 4 = 3.335×10⁻⁹ N (قوة صغيرة جداً).',
'مثال 2: إذا كان g = 10 m/s² على سطح الأرض، فما g على ارتفاع h = R فوق السطح؟ وما وزن شخص كتلته 60 kg هناك؟','§g′ = GM / (2R)² = g / 4','الحل: g′ = 10 / 4 = 2.5 m/s²، والوزن W = mg′ = 60 × 2.5 = 150 N.',
'مثال 3: يبعد كوكب عن الشمس 4 AU. ما فترته المدارية بالسنوات علماً أن الأرض تبعد 1 AU وفترتها سنة؟','§T² / T_E² = r³ / r_E³ = 4³ = 64','الحل: T² = 64 × 1² فـ T = 8 سنوات.'];

/* ===== s9: العزم والاتزان (10) ===== */
NEW.s9=[
()=>{const r=P([2,4,6,8]),F=R(2,9)*10,t=r*F/2;return GN(`تؤثر قوة مقدارها ${F} N في نقطة تبعد ${r} m عن محور الدوران، وتصنع القوة زاوية 30° مع الخط الواصل بين المحور ونقطة التأثير. ما مقدار عزمها حول المحور؟`,t,[r*F,r*F*2,F/r],`τ = rF sinθ = ${r} × ${F} × sin 30° = ${r} × ${F} × 0.5 = ${t} N·m.`,'N·m')},
()=>{const L=P([2,4,6,8]),F=R(2,9)*10,t=F*L/2;return WS(FIG.vec({mag:`L = ${L} m`,ang:60,x:'d',angLabel:'60°'}),GN(`قضيب طوله L = ${L} m يدور حول محور عند طرفه O ويميل بزاوية 60° على الأفقي كما في الشكل. تؤثر في طرفه الآخر قوة رأسية للأسفل مقدارها ${F} N. ما عزم هذه القوة حول O؟ (d ذراع القوة الأفقي)`,t,[F*L,F*L/4,F/L],`ذراع القوة d = L cos 60° = ${L} × 0.5 = ${L/2} m، فـ τ = F d = ${F} × ${L/2} = ${t} N·m.`,'N·m'))},
()=>{const F1=R(2,6)*5,F2=R(4,8)*5,net=4*F2-2*F1,cw='مع عقارب الساعة',cc='عكس عقارب الساعة';
 const q=M(`عارضة خفيفة (مهملة الوزن) تدور حول المحور المبيّن في الشكل، وتؤثر فيها قوتان رأسيتان للأسفل: ${F1} N عند الطرف الأيسر و ${F2} N عند الطرف الأيمن (بعد المحور 2 m عن الطرف الأيسر و 4 m عن الأيمن). ما العزم المحصّل حول المحور؟`,`${net} N·m ${cw}`,[`${net} N·m ${cc}`,`${4*F2+2*F1} N·m ${cw}`,`${2*(F2-F1)} N·m ${cw}`],`عزم القوة اليمنى = ${F2} × 4 = ${4*F2} N·m مع عقارب الساعة، وعزم اليسرى = ${F1} × 2 = ${2*F1} N·m عكس عقارب الساعة. المحصلة = ${4*F2} − ${2*F1} = ${net} N·m مع عقارب الساعة.`);
 return WS(FIG.beam({len:6,pivot:2,forces:[{x:0,t:`${F1} N`},{x:6,t:`${F2} N`}],marks:[{x1:0,x2:2,t:'2 m'},{x1:2,x2:6,t:'4 m'}]}),q)},
()=>{const F1=R(2,9)*10,F2=F1/2;return WS(FIG.beam({len:6,pivot:2,forces:[{x:0,t:`${F1} N`},{x:6,t:'F = ؟'}],marks:[{x1:0,x2:2,t:'2 m'},{x1:2,x2:6,t:'4 m'}]}),GN(`عارضة خفيفة طولها 6 m ترتكز على محور يبعد 2 m عن طرفها الأيسر، وتؤثر عند الطرف الأيسر قوة ${F1} N للأسفل. ما مقدار القوة F الرأسية للأسفل عند الطرف الأيمن اللازمة لتتزن العارضة أفقياً؟`,F2,[F1*2,F1,F1/4],`شرط الاتزان Στ = 0 حول المحور: ${F1} × 2 = F × 4 فـ F = ${2*F1}/4 = ${F2} N.`,'N'))},
()=>{const [k,L]=P([[3,8],[3,12],[2,12],[5,12],[4,10],[2,6]]),b=R(1,4)*10,a=k*b,d=L/(k+1);return WS(FIG.beam({len:L,forces:[{x:0,t:`${a} N`},{x:L,t:`${b} N`}],marks:[{x1:0,x2:L,t:`${L} m`}]}),GN(`عارضة خفيفة طولها ${L} m تحمل قوتين رأسيتين للأسفل: ${a} N عند طرفها الأيسر و ${b} N عند طرفها الأيمن. على أي بعد من الطرف الأيسر يجب وضع محور الارتكاز لتتزن العارضة أفقياً؟`,d,[L-d,L/2,L/k],`ليكن البعد d من الطرف الأيسر: ${a} × d = ${b} × (${L} − d) فـ ${a+b}d = ${b*L} ومنه d = ${d} m (المحور أقرب إلى القوة الأكبر).`,'m'))},
()=>{const W=P([20,40,60,80]),F=W/2;return WS(FIG.beam({len:6,pivot:2,forces:[{x:0,t:'F = ؟'},{x:3,t:`W = ${W} N`}],marks:[{x1:0,x2:2,t:'2 m'},{x1:2,x2:6,t:'4 m'}]}),GN(`عارضة منتظمة طولها 6 m ووزنها ${W} N ترتكز على محور يبعد 2 m عن طرفها الأيسر. ما القوة F الرأسية للأسفل التي تُسلَّط عند طرفها الأيسر لتتزن العارضة أفقياً؟ (يؤثر وزن العارضة عند منتصفها)`,F,[W,2*W,W/4],`وزن العارضة عند منتصفها (على بعد 3 − 2 = 1 m يمين المحور): F × 2 = ${W} × 1 فـ F = ${F} N.`,'N'))},
()=>{const Wb=R(2,8)*20,P0=R(1,6)*30,d=P([2,4]),NR=Wb/2+P0*d/6,NL=Wb+P0-NR;return WS(FIG.beam({len:6,forces:[{x:3,t:`W = ${Wb} N`},{x:d,t:`${P0} N`,up:false},{x:0,t:'N₁',up:true},{x:6,t:'N₂',up:true}],marks:[{x1:0,x2:d,t:`${d} m`},{x1:0,x2:6,t:'6 m'}]}),GN(`عارضة منتظمة طولها 6 m ووزنها ${Wb} N ترتكز على دعامتين عند طرفيها، ويقف عليها شخص وزنه ${P0} N على بعد ${d} m من الطرف الأيسر. ما قوة رد فعل الدعامة اليمنى N₂؟`,NR,[NL,(Wb+P0)/2,Wb/2+P0*d/3],`نأخذ العزوم حول الدعامة اليسرى: N₂ × 6 = ${Wb} × 3 + ${P0} × ${d} = ${Wb*3+P0*d} فـ N₂ = ${NR} N (ويكون N₁ = ${NL} N لأن N₁ + N₂ = ${Wb+P0} N).`,'N'))},
()=>{const [m1,m2]=P([[2,4],[1,2],[1,5],[4,2],[3,1],[5,1],[1,3]]),x=m2*6/(m1+m2);return WS(FIG.beam({len:6,forces:[{x:0,t:`${m1} kg`},{x:6,t:`${m2} kg`}],marks:[{x1:0,x2:6,t:'6 m'}]}),GN(`قضيب خفيف طوله 6 m تتصل به كتلتان نقطيتان: ${m1} kg عند طرفه الأيسر و ${m2} kg عند طرفه الأيمن. على أي بعد من الطرف الأيسر يقع مركز ثقل المجموعة؟`,x,[3,m1*6/(m1+m2),(m1+m2)/2],`x = (m₁x₁ + m₂x₂)/(m₁ + m₂) = (${m1} × 0 + ${m2} × 6)/${m1+m2} = ${x} m من الطرف الأيسر (أقرب إلى الكتلة الأكبر).`,'m'))},
M('ما شرطا الاتزان التام لجسم صلب (ساكن أو يتحرك دون دوران وبسرعة ثابتة)؟','ΣF = 0 و Στ = 0 معاً',['ΣF = 0 فقط','Στ = 0 فقط','ΣF = ma و Στ ≠ 0'],'الاتزان التام يتطلب انعدام القوة المحصلة (اتزان انتقالي) وانعدام العزم المحصّل (اتزان دوراني) في الوقت نفسه.'),
WS(FIG.beam({len:6,pivot:3,forces:[{x:1,t:'20 N'},{x:5,t:'10 N',up:true}],marks:[{x1:1,x2:3,t:'2 m'},{x1:3,x2:5,t:'2 m'}]}),M('في الشكل، ما اتجاه دوران العارضة الذي تسببه القوة 10 N المؤثرة رأسياً للأعلى عند يمين المحور حول هذا المحور؟','عكس عقارب الساعة',['مع عقارب الساعة','لا تُحدث دوراناً لأنها تؤثر للأعلى','لا تُحدث دوراناً لأن ذراعها يساوي صفراً'],'القوة الرأسية للأعلى على يمين المحور ترفع الطرف الأيمن فيدور الجسم عكس عقارب الساعة، وعزمها = 10 × 2 = 20 N·m.')),
];
SUM.s9=['العزم τ = r F sinθ (N·m): r البعد عن محور الدوران وθ الزاوية بين القوة والخط الواصل للمحور؛ والعزم أكبر ما يكون عندما تكون القوة عمودية (θ = 90°) وينعدم إذا مرّ خط عملها بالمحور.','ذراع القوة d = r sinθ هي المسافة العمودية من المحور إلى خط عمل القوة، وτ = F d.','العزم عكس عقارب الساعة موجب عادة ومع عقارب الساعة سالب، والعزم المحصّل هو المجموع الجبري لعزوم القوى.','شرطا الاتزان: ΣF = 0 و Στ = 0 (حول أي نقطة)، ويُستخدم الثاني لإيجاد قوة مجهولة أو موضع الارتكاز.','مركز الثقل نقطة تؤثر عندها محصلة الأوزان؛ ويقع في منتصف الجسم المنتظم، وحساب موضعه x = Σmx/Σm.'];
EX.s9=['مثال 1: مفتاح ربط طوله 0.4 m يُسحب من طرفه بقوة 50 N عمودياً عليه، ثم بزاوية 30° مع الخط الواصل. احسب العزم في الحالتين.','§τ = r F sinθ','الحل: عمودياً: 0.4 × 50 × 1 = 20 N·m؛ وبزاوية 30°: 0.4 × 50 × 0.5 = 10 N·m.',
'مثال 2: لعبة أرجوحة (عارضة خفيفة): طفل وزنه 300 N يجلس على بعد 2 m من المحور. أين يجلس طفل وزنه 400 N ليتزنا؟','§F₁ d₁ = F₂ d₂  ⟹  300 × 2 = 400 × d₂','الحل: d₂ = 600 / 400 = 1.5 m من المحور على الجهة المقابلة.',
'مثال 3: عارضة منتظمة طولها 4 m ووزنها 100 N ترتكز على دعامتين عند طرفيها، ويوضع حمل 200 N على بعد 1 m من الطرف الأيسر. احسب رد فعل الدعامة اليمنى.','§Στ (حول اليسرى) = 0:  N₂ × 4 = 100 × 2 + 200 × 1','الحل: N₂ = 400 / 4 = 100 N؛ ومن ΣF = 0: N₁ = 300 − 100 = 200 N.'];

/* ===== SUM / EX لبقية الأقسام ===== */
SUM.s5=['القوة كمية متجهة تقاس بالنيوتن: 1 N = 1 kg·m/s²، ومحصلة القوى ΣF هي المجموع الاتجاهي لها.','قانون نيوتن الأول (القصور الذاتي): يبقى الجسم ساكناً أو متحركاً بسرعة ثابتة في خط مستقيم ما لم تؤثر فيه محصلة قوى غير صفرية.','قانون نيوتن الثاني: ΣF = ma؛ التسارع يتناسب طردياً مع المحصلة وعكسياً مع الكتلة ويكون باتجاه المحصلة.','قانون نيوتن الثالث: لكل قوة فعل قوة رد فعل مساوية لها في المقدار ومعاكسة في الاتجاه، وتؤثران في جسمين مختلفين فلا تلغيان بعضهما.','الكتلة (kg) مقدار قياسي ثابت يقيس القصور الذاتي، والوزن W = mg (N) قوة جذب تتغير بتغير g.'];
EX.s5=['مثال 1: جسم كتلته 5 kg تؤثر فيه قوتان أفقيتان: 30 N شرقاً و 10 N غرباً. احسب تسارعه.','§ΣF = 30 − 10 = 20 N،  a = ΣF / m','الحل: a = 20 / 5 = 4 m/s² شرقاً.',
'مثال 2: رائد فضاء كتلته 70 kg؛ احسب وزنه على الأرض (g = 10 m/s²) وعلى القمر (g = 1.6 m/s²).','§W = m g','الحل: على الأرض 70 × 10 = 700 N، وعلى القمر 70 × 1.6 = 112 N، وكتلته 70 kg في الحالتين.',
'مثال 3: تؤثر قوتان متعامدتان 6 N و 8 N في جسم كتلته 2 kg. احسب تسارعه.','§ΣF = √(6² + 8²) = √100 = 10 N','الحل: a = ΣF / m = 10 / 2 = 5 m/s².'];
SUM.s6=['القوة العمودية N قوة تلامس تؤثر عمودياً على السطح؛ وعلى سطح أفقي دون قوى رأسية أخرى N = mg.','الاحتكاك السكوني f_s ≤ μ_s N (قيمة عظمى قبل بدء الحركة)، والحركي f_k = μ_k N ثابت أثناء الانزلاق، وعادة μ_k < μ_s، ويعاكس الاحتكاك اتجاه الحركة (أو الحركة المحتملة).','على مستوى مائل بزاوية θ: المركبة الموازية للمستوى mg sinθ والعمودية عليه mg cosθ، ومنها N = mg cosθ.','التسارع على مستوى مائل أملس: a = g sinθ، وبوجود احتكاك حركي: a = g sinθ − μ_k g cosθ.','الاحتكاك لا يعتمد على مساحة التلامس ويتناسب مع القوة العمودية فقط.'];
EX.s6=['مثال 1: صندوق كتلته 20 kg على أرض أفقية، μ_k = 0.3، يُدفع بقوة أفقية 80 N. احسب تسارعه (g = 10 m/s²).','§N = mg = 200 N،  f_k = μ_k N = 0.3 × 200 = 60 N','الحل: a = (F − f_k)/m = (80 − 60)/20 = 1 m/s².',
'مثال 2: جسم كتلته 10 kg ينزلق على مستوى مائل أملس زاويته 30°. احسب مركبة الوزن الموازية للمستوى والتسارع.','§mg sinθ = 10 × 10 × 0.5 = 50 N،  a = g sinθ','الحل: a = 10 × 0.5 = 5 m/s² (50/10 = 5 m/s²).',
'مثال 3: جسم كتلته 10 kg ينزلق على مستوى مائل زاويته 37° وμ_k = 0.5 (sin 37° ≈ 0.6، cos 37° ≈ 0.8). احسب التسارع.','§N = mg cosθ = 80 N،  f_k = 0.5 × 80 = 40 N،  mg sinθ = 60 N','الحل: a = (60 − 40)/10 = 2 m/s² نحو أسفل المستوى.'];
SUM.s8=['التسارع المركزي في الحركة الدائرية المنتظمة a_c = v²/r ويتجه نحو المركز، والقوة المركزية F_c = mv²/r هي محصلة القوى نحو المركز وليست قوة جديدة.','الزمن الدوري T = 2πr/v (زمن دورة كاملة)، والتردد f = 1/T، والسرعة v = 2πr/T.','السرعة الزاوية ω = Δθ/Δt (rad/s) وترتبط بالسرعة الخطية v = ωr، والتسارع الزاوي α = Δω/Δt (rad/s²).','معادلات الحركة الدورانية بتسارع زاوي ثابت: ω = ω₀ + αt، θ = ω₀t + ½αt²، ω² = ω₀² + 2αθ (مشابهة لمعادلات الحركة الخطية).','إذا انعدمت القوة المركزية انطلق الجسم في خط مستقيم مماسّاً للمسار.'];
EX.s8=['مثال 1: سيارة كتلتها 1000 kg تقطع منعطفاً نصف قطره 50 m بسرعة 10 m/s. احسب التسارع المركزي والقوة المركزية.','§a_c = v² / r = 10² / 50 = 2 m/s²،  F_c = m a_c','الحل: F_c = 1000 × 2 = 2000 N نحو مركز المنعطف.',
'مثال 2: جسم يدور في دائرة نصف قطرها 10 m بسرعة 5π m/s. احسب زمنه الدوري.','§T = 2πr / v = (2π × 10) / (5π)','الحل: T = 4 s.',
'مثال 3: دولاب يبدأ من السكون بتسارع زاوي ثابت 2 rad/s² مدة 5 s. احسب سرعته الزاوية النهائية والزاوية التي دارها.','§ω = ω₀ + αt = 0 + 2 × 5،  θ = ½αt² = ½ × 2 × 5²','الحل: ω = 10 rad/s وθ = 25 rad.'];
SUM.s10=['الزخم الخطي p = mv (kg·m/s) كمية متجهة باتجاه السرعة.','الدفع J = FΔt = Δp = m(v − v₀) (N·s)؛ ومساحة تحت منحنى (القوة – الزمن) تساوي الدفع.','زيادة زمن التصادم تقلل القوة المتوسطة لنفس التغير في الزخم (الوسائد وأحزمة الأمان).','قانون حفظ الزخم: في نظام معزول Σp قبل = Σp بعد، أي m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′.','التصادم المرن يحفظ الزخم والطاقة الحركية، وغير المرن يحفظ الزخم فقط، وفي التام عدم المرونة يلتحم الجسمان: m₁v₁ + m₂v₂ = (m₁ + m₂)v.'];
EX.s10=['مثال 1: كرة كتلتها 0.5 kg تتحرك بسرعة 10 m/s فتتوقف خلال 0.05 s. احسب الدفع والقوة المتوسطة.','§J = Δp = m(v − v₀) = 0.5 × (0 − 10) = −5 N·s','الحل: F = J/Δt = −5 / 0.05 = −100 N، أي قوة مقدارها 100 N عكس اتجاه الحركة.',
'مثال 2: عربة كتلتها 2 kg بسرعة 6 m/s تصطدم بعربة ساكنة كتلتها 4 kg وتلتحمان. احسب سرعتهما بعد التصادم.','§m₁v₁ = (m₁ + m₂) v  ⟹  2 × 6 = 6 v','الحل: v = 12 / 6 = 2 m/s باتجاه حركة العربة الأولى.',
'مثال 3: بندقية كتلتها 4 kg تُطلق رصاصة كتلتها 0.01 kg بسرعة 400 m/s. احسب سرعة ارتداد البندقية.','§0 = m_b v_b + m_g v_g = 0.01 × 400 + 4 × v_g','الحل: v_g = −4 / 4 = −1 m/s، أي 1 m/s في عكس اتجاه الرصاصة.'];
SUM.s11=['الشغل W = F d cosθ (J)، ويكون صفراً إذا كانت القوة عمودية على الإزاحة، وسالباً إذا عاكستها.','القدرة P = W/t (watt) وتساوي أيضاً P = Fv للسرعة الثابتة.','الطاقة الحركية KE = ½mv²، ونظرية الشغل والطاقة: W_net = ΔKE.','الآلات البسيطة (رافعة، بكرة، مستوى مائل...) تغير مقدار القوة أو اتجاهها ولا تقلل الشغل؛ الفائدة الميكانيكية MA = F_r/F_e (قوة المقاومة إلى قوة الجهد).','الكفاءة e = (W_out/W_in) × 100% وهي دائماً أقل من 100% بسبب الاحتكاك.'];
EX.s11=['مثال 1: يُسحب صندوق مسافة 10 m بقوة 50 N تصنع زاوية 60° مع الأفقي خلال 5 s. احسب الشغل والقدرة.','§W = F d cosθ = 50 × 10 × cos 60° = 250 J','الحل: P = W/t = 250 / 5 = 50 W.',
'مثال 2: سيارة كتلتها 1000 kg تتسارع من 10 m/s إلى 20 m/s. احسب الشغل المبذول عليها.','§W_net = ½m(v² − v₀²) = ½ × 1000 × (20² − 10²)','الحل: W_net = 500 × 300 = 150000 J = 150 kJ.',
'مثال 3: بجهد 100 N يتحرك مسافة 5 m تُرفع كتلة حمل وزنها 400 N مسافة 1 m بآلة. احسب الفائدة الميكانيكية الفعلية والكفاءة.','§MA = F_r / F_e = 400 / 100،  e = W_out / W_in = (400 × 1) / (100 × 5)','الحل: MA = 4، و e = 400/500 = 0.8 = 80%.'];
SUM.s12=['الطاقة الميكانيكية ME = KE + PE، وطاقة الوضع الجاذبية PE = mgh والحركية KE = ½mv².','في غياب الاحتكاك ومقاومة الهواء تتحفظ الطاقة الميكانيكية: ½mv₁² + mgh₁ = ½mv₂² + mgh₂.','عند السقوط الحر من سكون: v = √(2gh) وهي لا تعتمد على الكتلة.','عند وجود احتكاك: ME₁ − ME₂ = الشغل ضد الاحتكاك (تتحول إلى حرارة) فتتناقص الطاقة الميكانيكية.','في المنحنيات والأراجيح تتحول طاقة الوضع إلى حركية عند النقطة الأدنى والعكس عند النقطة الأعلى، حيث تنعدم السرعة لحظياً.'];
EX.s12=['مثال 1: كرة كتلتها 2 kg تسقط من ارتفاع 20 m. احسب سرعتها لحظة الوصول إلى الأرض (g = 10 m/s²).','§mgh = ½mv²  ⟹  v = √(2gh) = √(2 × 10 × 20)','الحل: v = √400 = 20 m/s، وطاقتها الحركية 400 J = 2 × 10 × 20.',
'مثال 2: ينحرف بندول كتلته 1 kg حتى ارتفاع 0.8 m فوق أدنى نقطة ثم يُترك. احسب سرعته عند أدنى نقطة.','§v = √(2gh) = √(2 × 10 × 0.8) = √16','الحل: v = 4 m/s.',
'مثال 3: كتلة 5 kg تنزلق من ارتفاع 2 m فتصل إلى القاع بسرعة 4 m/s. احسب الطاقة المفقودة بالاحتكاك.','§PE = mgh = 5 × 10 × 2 = 100 J،  KE = ½mv² = ½ × 5 × 4²','الحل: KE = 40 J، فالمفقود = 100 − 40 = 60 J.'];

/* ===== nD.js : s13 (الطاقة الحرارية ودرجة الحرارة وانتقال الحرارة) و s14 (الحرارة النوعية والتغير الطوري والقانون الأول) ===== */
NEW.s13=[
 M('الحالة التي لها شكل وحجم ثابتان هي:','الصلبة',['السائلة','الغازية','البلازما'],'جسيمات المادة الصلبة مرتبطة بقوى قوية وتهتز حول مواضع ثابتة فيبقى الشكل والحجم ثابتين.'),
 M('المادة التي لها حجم ثابت وتأخذ شكل الإناء الذي توضع فيه هي:','السائل',['الصلب','الغاز','البلازما'],'جسيمات السائل تنزلق فوق بعضها فتتغير صورته مع بقاء حجمه.'),
 M('المادة التي تملأ الإناء الذي توضع فيه وتتغير في شكلها وحجمها هي:','الغاز',['السائل','الصلب','الجليد'],'قوى التجاذب بين جسيمات الغاز ضعيفة جداً فيتمدد ليملأ الحيز المتاح.'),
 M('حالة المادة التي تتكون من غاز متأين (أيونات وإلكترونات حرة) وتوجد في النجوم والبرق هي:','البلازما',['الصلبة','السائلة','الغازية العادية'],'البلازما هي الحالة الرابعة للمادة وأكثرها شيوعاً في الكون.'),
 M('تهتز جسيمات المادة الصلبة:','حول مواضع ثابتة تقريباً',['بحرية تامة في كل اتجاه','دون أي حركة','بسرعات عالية جداً متباعدة'],'ترتبط الجسيمات بقوى قوية فلا تنتقل لكنها تهتز حول مواضعها.'),
 M('الطاقة الحرارية لجسم هي:','مجموع طاقات حركة وطاقات وضع جسيماته',['متوسط طاقة حركة جسيماته فقط','الحرارة المنتقلة إلى الجسم','درجة حرارة الجسم'],'الطاقة الحرارية تعتمد على عدد الجسيمات وحركتها وتفاعلاتها.'),
 M('درجة الحرارة مقياس لـ:','متوسط الطاقة الحركية لجسيمات المادة',['مجموع الطاقة الحرارية للجسم','كمية الحرارة المنتقلة','عدد جسيمات الجسم'],'كلما زاد متوسط الطاقة الحركية لجسيمات الجسم ارتفعت درجة حرارته.'),
 M('كوب ماء وحوض ماء لهما درجة الحرارة نفسها، فإن:','الحوض أكبر في الطاقة الحرارية',['الكوب أكبر في الطاقة الحرارية','الطاقتان متساويتان','الكوب أعلى في درجة الحرارة'],'الطاقة الحرارية تعتمد على كتلة المادة (عدد الجسيمات) إضافة إلى درجة الحرارة.'),
 ()=>{const c=P([-20,0,27,37,127,100,50,-73]);return GN(`درجة حرارة جسم ${c.toString().replace('-','−')} °C تساوي بالكلفن (K = °C + 273):`,c+273,[c-273,c+373,c*273],`T(K) = ${fm(c)} + 273 = ${c+273} K.`,'K')},
 ()=>{const k=P([273,300,373,250,323,473,200]);return GN(`درجة حرارة جسم ${k} K تساوي بالسيلسيوس:`,k-273,[k+273,k-373,k*273],`T(°C) = ${k} − 273 = ${k-273} °C.`,'°C')},
 M('الصفر المطلق يساوي:','0 K = −273 °C',['0 K = 0 °C','273 K = 0 °C','0 K = 273 °C'],'الصفر المطلق أدنى درجة حرارة نظرياً، تتوقف عندها حركة الجسيمات الحرارية.'),
 M('الحرارة هي:','طاقة تنتقل بين جسمين نتيجة اختلاف درجتي حرارتهما',['مقياس لمتوسط الطاقة الحركية للجسيمات','مجموع الطاقة الحرارية في الجسم','درجة حرارة الجسم الساخن'],'تنتقل الحرارة دائماً من الجسم الأعلى حرارة إلى الأقل حرارة.'),
 M('تنتقل الحرارة تلقائياً:','من الجسم الأعلى درجة حرارة إلى الأقل',['من الجسم الأقل درجة حرارة إلى الأعلى','من الجسم الأكبر كتلة إلى الأصغر','من الجسم الأقل طاقة حرارية إلى الأكبر'],'الاتجاه يحدده فرق درجة الحرارة وليس مقدار الطاقة الحرارية.'),
 M('يكون جسمان في حالة اتزان حراري عندما:','تتساوى درجتا حرارتيهما ويتوقف انتقال صافي الحرارة بينهما',['تتساوى طاقتاهما الحرارية','تتساوى كتلتاهما','تتساوى حرارتاهما النوعيتان'],'عند الاتزان الحراري لا يوجد انتقال صافٍ للحرارة بين الجسمين.'),
 ()=>{const a=R(10,40),d=R(5,30);return GN(`ارتفعت درجة حرارة جسم من ${a} °C إلى ${a+d} °C، فكان التغير في درجة حرارته بالكلفن:`,d,[d+273,a+d,d-273],`التغير في الكلفن يساوي التغير في السيلسيوس: ${a+d} − ${a} = ${d} K.`,'K')},
 M('انتقال الحرارة عبر المواد الصلبة بتلامس الجسيمات دون انتقال المادة نفسها يسمى:','التوصيل',['الحمل','الإشعاع','التبخر'],'في التوصيل تنتقل الطاقة من جسيم إلى مجاور له.'),
 M('انتقال الحرارة في الموائع (السوائل والغازات) بحركة المادة نفسها يسمى:','الحمل',['التوصيل','الإشعاع','الانعكاس'],'تسخين المائع يقلل كثافته فيرتفع وتحل محله مادة أبرد فتتكون تيارات حمل.'),
 M('انتقال الحرارة بالموجات الكهرومغناطيسية دون الحاجة إلى وسط مادي يسمى:','الإشعاع',['التوصيل','الحمل','التمدد'],'يصلنا دفء الشمس عبر الفراغ بالإشعاع.'),
 M('الطريقة الوحيدة لانتقال الحرارة عبر الفراغ هي:','الإشعاع',['التوصيل','الحمل','التوصيل والحمل معاً'],'التوصيل والحمل يحتاجان إلى وسط مادي.'),
 M('وصول طاقة الشمس إلى الأرض يتم بـ:','الإشعاع',['التوصيل','الحمل','التوصيل والحمل'],'الفضاء بين الشمس والأرض شبه فراغ.'),
 M('سخونة مقبض ملعقة معدنية وضع طرفها في شاي ساخن مثال على:','التوصيل',['الحمل','الإشعاع','التبخر'],'تنتقل الطاقة عبر المعدن من الطرف الساخن إلى المقبض.'),
 M('نسيم البحر في النهار يتكوّن أساساً بسبب:','الحمل',['التوصيل','الإشعاع المباشر فقط','التبخر'],'يسخن هواء اليابسة فيرتفع ويحل محله هواء أبرد قادم من البحر.'),
 M('المعادن موصلة جيدة للحرارة لأنها تحتوي على:','إلكترونات حرة تنقل الطاقة بسرعة',['جسيمات متباعدة','فراغات كبيرة بين الذرات','ذرات أخف من غيرها'],'تنقل الإلكترونات الحرة الطاقة بسرعة عبر الفلز.'),
 M('أي المواد الآتية عازل جيد للحرارة؟','الصوف والهواء المحبوس',['النحاس','الألمنيوم','الحديد'],'الغازات والمواد الليفية رديئة التوصيل للحرارة.'),
 M('الترمس يحفظ المشروبات ساخنة لأن جداره المزدوج:','مفرغ من الهواء وسطحه عاكس',['مصنوع من النحاس الأحمر','ممتلئ بماء بارد','أسود اللون'],'التفريغ يقلل التوصيل والحمل، والسطح اللامع يقلل الإشعاع.'),
 M('الأسطح السوداء الخشنة مقارنةً بالبيضاء اللامعة:','أكثر امتصاصاً للإشعاع الحراري',['أقل امتصاصاً للإشعاع','تعكس الإشعاع أكثر','لا تتأثر بالإشعاع'],'الألوان الداكنة تمتص الإشعاع أكثر ولذلك ترتفع حرارتها بسرعة.'),
 M('يوضع سخان الغرفة قرب الأرض لأن الهواء الساخن:','يرتفع للأعلى مكوناً تيارات حمل',['يهبط للأسفل','لا يتحرك','ينتقل بالتوصيل فقط'],'الهواء الساخن أقل كثافة فيصعد ويحل محله هواء أبرد.'),
 M('تترك فجوات تمدد بين قضبان السكك الحديدية لأن الفلزات:','تتمدد عند ارتفاع درجة الحرارة',['تنكمش عند التسخين','تتبخر عند التسخين','لا تتأثر بالحرارة'],'زيادة الطاقة الحركية للجسيمات تزيد متوسط المسافات بينها فيتمدد الجسم.'),
 M('الثرمومتر الزئبقي يعمل بمبدأ:','تمدد السائل بارتفاع درجة الحرارة',['تمدد الغاز بانخفاض الحرارة','توصيل الحرارة فقط','الإشعاع الكهرومغناطيسي'],'يرتفع الزئبق في الأنبوب الضيق عند تسخينه.'),
 M('يتجمد الماء عند درجة حرارة بالكلفن تساوي تقريباً:','273 K',['0 K','100 K','373 K'],'0 °C + 273 = 273 K.')
];
SUM.s13=['الموائع (السوائل والغازات): الضغط P = F/A بوحدة الباسكال (N/m²)، وضغط السائل P = ρ g h، ومبدأ باسكال (المكبس الهيدروليكي)، وقوة الطفو (أرخميدس)، ومبدأ برنولي (تزداد السرعة فيقل الضغط)، واللزوجة مقياس مقاومة التدفق.','حالات المادة: صلبة (شكل وحجم ثابتان) وسائلة (حجم ثابت) وغازية (تملأ الحيز) والبلازما (غاز متأين).','الطاقة الحرارية: مجموع طاقات الحركة والوضع للجسيمات، ودرجة الحرارة: مقياس لمتوسط الطاقة الحركية.','التحويل: T(K) = T(°C) + 273؛ والصفر المطلق 0 K = −273 °C؛ وفرق الدرجات واحد في السيلسيوس والكلفن.','الحرارة تنتقل من الأسخن إلى الأبرد حتى الاتزان الحراري.','طرق الانتقال: التوصيل (في الصلب بالتلامس)، الحمل (في الموائع بحركة المادة)، الإشعاع (بالموجات الكهرومغناطيسية ولو في الفراغ).'];
EX.s13=['مثال 1: حوّل 27 °C إلى كلفن.','§T(K) = T(°C) + 273','الحل: T = 27 + 273 = 300 K.',
 'مثال 2: ارتفعت درجة الحرارة من 20 °C إلى 50 °C، ما التغير بالكلفن؟','§ΔT = 50 − 20 = 30 °C = 30 K','الحل: التغير في الكلفن = التغير في السيلسيوس = 30 K.',
 'مثال 3: أي طرق انتقال الحرارة تحدث في الفراغ؟','الحل: الإشعاع فقط، لأن التوصيل والحمل يحتاجان إلى وسط مادي.'];

NEW.s14=[
 ()=>{const m=P([2,3,4,5]),c=P([450,900,4200]),d=P([10,20,40]);return GN(`ما كمية الحرارة اللازمة لرفع درجة حرارة ${m} kg من مادة حرارتها النوعية ${c} J/kg·K بمقدار ${d} K؟`,m*c*d,[m*c,c*d,m*c*d*2],`Q = m c ΔT = ${m} × ${c} × ${d} = ${m*c*d} J.`,'J')},
 ()=>{const m=P([1,2,3,5]),a=P([10,20,25]),b=P([50,60,70]);return GN(`ما كمية الحرارة اللازمة لتسخين ${m} kg من الماء من ${a} °C إلى ${b} °C؟ (الحرارة النوعية للماء 4200 J/kg·K)`,m*4.2*(b-a),[m*4.2*(b+a),m*4.2,m*(b-a)],`Q = m c ΔT = ${m} × 4200 × (${b} − ${a}) = ${m*4200*(b-a)} J = ${f(m*4.2*(b-a))} kJ.`,'kJ')},

/* سؤال نصي: c و cands نصوص */

()=>{const m1=R(2,6)*10,m2=R(2,6)*10;return GQ(`ساق خفيفة ترتكز على نقطة، علّق عليها ثقلان كتلتاهما ${m1} kg و ${m2} kg وهي متزنة (g = 10 m/s²). قوة رد فعل نقطة الارتكاز`,10*(m1+m2),[10*Math.abs(m1-m2),m1+m2,5*(m1+m2)],`ΣF = 0 ⇒ N = W₁ + W₂ = ${10*m1} + ${10*m2} = ${10*(m1+m2)} N.`,'N')},

()=>{const F=R(5,30),d=R(2,10);return GQ(`بُذل شغل ${F*d} J لتحريك جسم مسافة ${d} m بقوة في اتجاه الإزاحة. مقدار القوة`,F,[F*d*d,F+d,F*d+d],`F = W ÷ d = ${F*d} ÷ ${d} = ${F} N.`,'N')},
()=>{const F=R(5,30),d=R(2,10);return GQ(`بذلت قوة ${F} N شغلاً مقداره ${F*d} J في اتجاه الإزاحة. المسافة التي تحركها الجسم`,d,[F*d*F,F+d,F],`d = W ÷ F = ${F*d} ÷ ${F} = ${d} m.`,'m')},
()=>{const F=R(15,40),fr=R(3,12),d=R(3,10);return GQ(`يُسحب صندوق مسافة ${d} m بقوة ${F} N في اتجاه الحركة ويعاكسها احتكاك ${fr} N. الشغل المحصل`,(F-fr)*d,[(F+fr)*d,F*d,fr*d],`W = (F − f)d = (${F} − ${fr}) × ${d} = ${(F-fr)*d} J.`,'J')},
()=>{const F=R(2,8)*5,d=R(2,8)*2;return GQ(`تزداد القوة المؤثرة في جسم بانتظام من صفر إلى ${F} N خلال إزاحة ${d} m. الشغل المبذول (المساحة تحت منحنى القوة – الإزاحة)`,F*d/2,[F*d,F*d*2,F+d],`المساحة مثلث: ½ × ${F} × ${d} = ${F*d/2} J.`,'J')},
()=>{const m=R(2,10)*5,L=R(2,10)*2;return GQ(`يرفع شخص جسماً كتلته ${m} kg على مستوى مائل أملس طوله ${L} m بزاوية 30° مع الأفقي (g = 10 m/s²). الشغل المبذول`,m*10*L/2,[m*10*L,m*L,m*10*L*0.866],`الارتفاع h = L sin30° = ${L/2} m، W = mgh = ${m*10*L/2} J.`,'J')},
()=>{const F=R(10,50),d=R(2,10);return GQ(`حُمل صندوق وزنه ${F} N أفقياً مسافة ${d} m بسرعة ثابتة. الشغل الذي يبذله وزن الصندوق`,0,[F*d,F*d/2,F+d],`الوزن عمودي على الإزاحة الأفقية (θ = 90°) فشغله = صفر.`,'J')}
],
/* ===== 5 الطاقة الحركية ===== */
s5:[
()=>{const m=2*R(1,10),v=R(2,12);return GQ(`جسم كتلته ${m} kg يتحرك بسرعة ${v} m/s. طاقته الحركية`,m*v*v/2,[m*v,m*v*v,m*v/2],`KE = ½mv² = ½ × ${m} × ${v}² = ${m*v*v/2} J.`,'J')},
()=>{const m=R(2,10),v=R(2,12);return GQ(`جسم يتحرك بسرعة ${v} m/s وطاقته الحركية ${m*v*v/2} J. كتلته`,m,[m*v*v,v,m*v],`m = 2KE ÷ v² = ${m*v*v} ÷ ${v*v} = ${m} kg.`,'kg')},
()=>{const m=R(2,10),v=R(2,12);return GQ(`جسم كتلته ${m} kg وطاقته الحركية ${m*v*v/2} J. سرعته`,v,[v*v,m*v*v,m*v],`v = √(2KE ÷ m) = √${v*v} = ${v} m/s.`,'m/s')},
()=>{const k=P([2,3,4]),E=R(2,10);return GQ(`طاقة جسم الحركية ${E} J. إذا زادت سرعته إلى ${k} أمثالها فإن طاقته الحركية تصبح`,E*k*k,[E*k,E*k*k*k,E/k],`KE ∝ v²: ${E} × ${k}² = ${E*k*k} J.`,'J')},
()=>{const k=P([2,3,4]),E=R(2,10);return GQ(`طاقة جسم الحركية ${E} J. إذا زادت كتلته إلى ${k} أمثالها مع ثبات سرعته فإن طاقته الحركية تصبح`,E*k,[E*k*k,E/k,E+k],`KE ∝ m: ${E} × ${k} = ${E*k} J.`,'J')},
()=>{const m=2*R(1,5),v1=R(1,6),v2=v1+R(2,6);return GQ(`زادت سرعة جسم كتلته ${m} kg من ${v1} m/s إلى ${v2} m/s. الشغل المبذول عليه`,m*(v2*v2-v1*v1)/2,[m*(v2-v1)*(v2-v1)/2,m*v2*v2/2,m*(v2-v1)],`W = ΔKE = ½m(v₂² − v₁²) = ½ × ${m} × (${v2*v2} − ${v1*v1}) = ${m*(v2*v2-v1*v1)/2} J.`,'J')},
()=>{const m=R(2,10)*100,v=P([10,20]),d=P([20,40,50]);return GQ(`سيارة كتلتها ${m} kg تسير بسرعة ${v} m/s تتوقف بعد مسافة ${d} m. متوسط قوة الفرملة`,m*v*v/2/d,[m*v*v/d,m*v/d,m*v*v*d],`W = ΔKE ⇒ Fd = ½mv² ⇒ F = ${m*v*v/2} ÷ ${d} = ${f(m*v*v/2/d)} N.`,'N')},
()=>{const d=R(5,25);return GQ(`سيارة تسير بسرعة معينة تتوقف على مسافة ${d} m عند الفرملة بقوة ثابتة. إذا تضاعفت سرعتها فإن مسافة توقفها بالقوة نفسها تصبح`,4*d,[2*d,8*d,d],`d ∝ v² فتصبح 4 × ${d} = ${4*d} m.`,'m')},
()=>{const m=R(2,10)*2,v=R(2,10);return GQ(`جسم كتلته ${m} kg ينطلق من السكون حتى تصل سرعته ${v} m/s. الشغل المبذول عليه`,m*v*v/2,[m*v,m*v*v,m*v/2],`W = ΔKE = ½ × ${m} × ${v}² = ${m*v*v/2} J.`,'J')},
()=>{const m1=R(2,6)*2,v1=R(2,6),m2=R(2,6)*2,v2=R(2,6);const a=m1*v1*v1,b=m2*v2*v2;return SQ(`جسم (A) كتلته ${m1} kg وسرعته ${v1} m/s، وجسم (B) كتلته ${m2} kg وسرعته ${v2} m/s. أيهما طاقته الحركية أكبر؟`,a>b?'الجسم A':a<b?'الجسم B':'متساويتان',['الجسم A','الجسم B','متساويتان'],`KE_A = ${a/2} J و KE_B = ${b/2} J.`)}
],
/* ===== 6 طاقة وضع الجاذبية ===== */
s6:[
()=>{const m=R(2,20),h=R(2,15);return GQ(`جسم كتلته ${m} kg على ارتفاع ${h} m عن سطح الأرض (g = 10 m/s²). طاقة وضعه`,m*10*h,[m*h,m*10,m*h*h],`PE = mgh = ${m} × 10 × ${h} = ${m*10*h} J.`,'J')},
()=>{const m=R(2,20),h=R(2,15);return GQ(`طاقة وضع جسم ${m*10*h} J على ارتفاع ${h} m (g = 10 m/s²). كتلته`,m,[m*h,m*10,m*10*h*h],`m = PE ÷ (gh) = ${m*10*h} ÷ ${10*h} = ${m} kg.`,'kg')},
()=>{const m=R(2,20),h=R(2,15);return GQ(`جسم كتلته ${m} kg وطاقة وضعه ${m*10*h} J (g = 10 m/s²). ارتفاعه`,h,[m*10*h/10,m*h,m+h],`h = PE ÷ (mg) = ${m*10*h} ÷ ${10*m} = ${h} m.`,'m')},
()=>{const m=R(2,10),h1=R(2,8),h2=h1+R(2,10);return GQ(`رُفع جسم كتلته ${m} kg من ارتفاع ${h1} m إلى ${h2} m (g = 10 m/s²). التغير في طاقة وضعه`,m*10*(h2-h1),[m*10*(h2+h1),m*10*h2,m*(h2-h1)],`ΔPE = mg(h₂ − h₁) = ${m} × 10 × ${h2-h1} = ${m*10*(h2-h1)} J.`,'J')},
()=>{const m=R(2,10)*5,h=R(2,10);return GQ(`رافعة ترفع حمولة كتلتها ${m} kg إلى ارتفاع ${h} m (g = 10 m/s²). الشغل المبذول بالقدر الذي تكتسبه من طاقة وضع`,m*10*h,[m*h,m*10,m*10*h/2],`W = ΔPE = mgh = ${m*10*h} J.`,'J')},
()=>{const m1=R(2,6),h1=R(2,6),m2=R(2,6),h2=R(2,6);const a=m1*h1,b=m2*h2;return SQ(`جسم (A) كتلته ${m1} kg على ارتفاع ${h1} m، وجسم (B) كتلته ${m2} kg على ارتفاع ${h2} m. أيهما طاقة وضعه أكبر؟`,a>b?'الجسم A':a<b?'الجسم B':'متساويتان',['الجسم A','الجسم B','متساويتان'],`PE_A ∝ ${a} و PE_B ∝ ${b}.`)},
()=>{const k=P([2,3,4]),E=R(2,10)*10;return GQ(`طاقة وضع جسم ${E} J. إذا زاد ارتفاعه إلى ${k} أمثاله فإن طاقة وضعه تصبح`,E*k,[E*k*k,E/k,E+k],`PE ∝ h: ${E} × ${k} = ${E*k} J.`,'J')},
()=>{const m=R(2,10)*5,L=R(2,10)*2;return GQ(`جسم كتلته ${m} kg على مستوى مائل بزاوية 30° ويبعد ${L} m عن أسفله على امتداد المستوى (g = 10 m/s²). طاقة وضعه بالنسبة لأسفل المستوى`,m*10*L/2,[m*10*L,m*L,m*10*L*0.866],`h = L sin30° = ${L/2} m، PE = mgh = ${m*10*L/2} J.`,'J')},
()=>{const m=R(2,10)*5,h=R(2,10);return GQ(`جسم كتلته ${m} kg على ارتفاع ${h} m على سطح القمر حيث g = 1.6 m/s². طاقة وضعه`,m*1.6*h,[m*10*h,m*h,m*1.6],`PE = mgh = ${m} × 1.6 × ${h} = ${f(m*1.6*h)} J.`,'J')},
()=>{const m=R(2,10),h=R(5,20),h0=R(1,4);return GQ(`جسم كتلته ${m} kg على ارتفاع ${h} m عن الأرض، اعتُبر سطح طاولة ارتفاعها ${h0} m مستوى الصفر (g = 10 m/s²). طاقة وضعه بالنسبة للطاولة`,m*10*(h-h0),[m*10*h,m*10*(h+h0),m*10*h0],`PE = mg(h − h₀) = ${m} × 10 × ${h-h0} = ${m*10*(h-h0)} J.`,'J')}
],
/* ===== 7 حفظ الطاقة الميكانيكية ===== */
s7:[
()=>{const h=P([5,20,45,80,125]);const v=Math.sqrt(20*h);return GQ(`يسقط جسم من السكون من ارتفاع ${h} m (g = 10 m/s²، دون احتكاك). سرعته لحظة وصوله إلى الأرض`,v,[2*v,v/2,h],`mgh = ½mv² ⇒ v = √(2gh) = √${20*h} = ${v} m/s.`,'m/s')},
()=>{const m=R(2,10),H=R(10,40),h=R(2,H-4);return GQ(`يسقط جسم كتلته ${m} kg من السكون من ارتفاع ${H} m. طاقته الحركية عند ارتفاع ${h} m (g = 10 m/s²)`,m*10*(H-h),[m*10*H,m*10*h,m*(H-h)],`KE = mg(H − h) = ${m} × 10 × ${H-h} = ${m*10*(H-h)} J.`,'J')},
()=>{const h=P([5,20,45,80]);const v=Math.sqrt(20*h);return GQ(`يُترك بندول من السكون عند ارتفاع ${h} m فوق أخفض نقطة (g = 10 m/s²، دون احتكاك). سرعته عند أخفض نقطة`,v,[2*v,v/2,v*v],`mgh = ½mv² ⇒ v = ${v} m/s.`,'m/s')},
()=>{const v=P([10,20,30,40]);const h=v*v/20;return GQ(`قُذف جسم رأسياً لأعلى بسرعة ${v} m/s (g = 10 m/s²). أقصى ارتفاع يصل إليه`,h,[v*v/10,v/10,v],`½mv² = mgh ⇒ h = v² ÷ 2g = ${v*v} ÷ 20 = ${h} m.`,'m')},
()=>{const m=2*R(1,5),v=R(2,10),h=R(2,10);return GQ(`جسم كتلته ${m} kg سرعته ${v} m/s على ارتفاع ${h} m (g = 10 m/s²). طاقته الميكانيكية`,m*v*v/2+m*10*h,[m*v*v/2,m*10*h,m*v*v+m*10*h],`ME = ½mv² + mgh = ${m*v*v/2} + ${m*10*h} = ${m*v*v/2+m*10*h} J.`,'J')},
()=>{const d=P([5,20,45]),h2=R(2,8);const v=Math.sqrt(20*d);return GQ(`عربة قطار ملاهٍ تنطلق من السكون من قمة ارتفاعها ${d+h2} m فتمر بنقطة ارتفاعها ${h2} m (g = 10 m/s²، دون احتكاك). سرعتها عند هذه النقطة`,v,[2*v,v/2,v*v],`½v² = g(H − h) ⇒ v = √(20 × ${d}) = ${v} m/s.`,'m/s')},
()=>{const h=P([5,20,45,80,125]);const v=Math.sqrt(20*h);return GQ(`ينزلق جسم من السكون على مستوى مائل أملس ارتفاعه ${h} m (g = 10 m/s²). سرعته عند أسفل المستوى`,v,[2*v,v/2,h],`لا يؤثر طول المستوى: v = √(2gh) = ${v} m/s.`,'m/s')},
()=>{const m=R(2,10),h=R(10,30),vf=R(2,8)*2;return GQ(`ينزلق جسم كتلته ${m} kg من السكون من ارتفاع ${h} m ويصل إلى الأسفل بسرعة ${vf} m/s (g = 10 m/s²). الطاقة المفقودة بالاحتكاك`,m*10*h-m*vf*vf/2,[m*10*h,m*vf*vf/2,m*10*h+m*vf*vf/2],`المفقودة = mgh − ½mv² = ${m*10*h} − ${m*vf*vf/2} = ${m*10*h-m*vf*vf/2} J.`,'J')},
()=>{const H=R(2,20)*2;return GQ(`يسقط جسم من السكون من ارتفاع ${H} m. الارتفاع الذي تتساوى عنده طاقته الحركية وطاقة وضعه (بإهمال الاحتكاك)`,H/2,[H,H/4,2*H],`KE = PE ⇒ mg(H − h) = mgh ⇒ h = H ÷ 2 = ${H/2} m.`,'m')},
()=>{const m=R(2,10),h=R(2,20);return GQ(`يسقط جسم كتلته ${m} kg من السكون من ارتفاع ${h} m. طاقته الحركية لحظة وصوله إلى الأرض (g = 10 m/s²)`,m*10*h,[m*h,m*10*h/2,m*10*h*2],`KE = mgh = ${m} × 10 × ${h} = ${m*10*h} J.`,'J')}
],
/* ===== 8 الآلات البسيطة ===== */
s8:[
()=>{const Fe=R(2,10)*10,k=R(2,6);return GQ(`آلة تؤثر بقوة مقاومة ${Fe*k} N عند بذل قوة جهد ${Fe} N. الفائدة الميكانيكية`,k,[Fe*k,1/k,Fe],`MA = Fr ÷ Fe = ${Fe*k} ÷ ${Fe} = ${k}.`)},
()=>{const dr=R(1,5),k=R(2,6);return GQ(`تتحرك قوة الجهد مسافة ${dr*k} m بينما تتحرك قوة المقاومة ${dr} m. الفائدة الميكانيكية المثالية`,k,[dr*k,1/k,dr],`IMA = dₑ ÷ d_r = ${dr*k} ÷ ${dr} = ${k}.`)},
()=>{const e=P([50,60,75,80,90]);return GQ(`آلة فائدتها المثالية 10 وفائدتها الميكانيكية ${e/10}. كفاءتها`,e,[e/10,100-e,e*10],`الكفاءة = (MA ÷ IMA) × 100 = (${e/10} ÷ 10) × 100 = ${e}%.`,'%')},
()=>{const Win=R(2,10)*100,e=P([50,60,75,80,90]);return GQ(`آلة كفاءتها ${e}% وشغل الجهد المبذول عليها ${Win} J. الشغل الناتج`,Win*e/100,[Win,Win/e*100,Win*e],`W_out = كفاءة × W_in = ${e/100} × ${Win} = ${Win*e/100} J.`,'J')},
()=>{const k=R(2,6),Fr=R(2,10)*30;return GQ(`رافعة مثالية فائدتها الميكانيكية ${k}. قوة الجهد اللازمة لرفع حمل ${Fr*k} N`,Fr,[Fr*k*k,Fr*k,Fr+k],`Fe = Fr ÷ MA = ${Fr*k} ÷ ${k} = ${Fr} N.`,'N')},
()=>{const de=R(2,6),dr=1,Fr=R(2,6)*de*10;return GQ(`رافعة مثالية تتحرك قوة الجهد عندها ${de} m وتتحرك قوة المقاومة ${dr} m، وقوة المقاومة ${Fr} N. قوة الجهد`,Fr*dr/de,[Fr*de,Fr,Fr+de],`Fe·dₑ = Fr·d_r ⇒ Fe = ${Fr} × ${dr} ÷ ${de} = ${Fr/de} N.`,'N')},
()=>{const n=R(2,6),W=n*R(20,60);return GQ(`نظام بكرات مثالي تحمل ${n} حبال الحمل الذي وزنه ${W} N. قوة الجهد اللازمة`,W/n,[W*n,W,W/(n+1)],`IMA = عدد الحبال = ${n}، Fe = W ÷ ${n} = ${W/n} N.`,'N')},
()=>{const h=R(1,4),k=R(2,5);return GQ(`مستوى مائل طوله ${h*k} m وارتفاعه ${h} m. الفائدة الميكانيكية المثالية`,k,[h*k,1/k,h],`IMA = L ÷ h = ${h*k} ÷ ${h} = ${k}.`)},
()=>{const Fe=R(2,10)*10,de=R(2,8);return GQ(`قوة جهد ${Fe} N تتحرك مسافة ${de} m في آلة. شغل الجهد المبذول`,Fe*de,[Fe+de,Fe/de,Fe*de*de],`W_in = Fe × dₑ = ${Fe} × ${de} = ${Fe*de} J.`,'J')},
()=>{const Fr=R(2,10)*50,dr=R(1,5),W=Fr*dr,e=P([50,80]);return GQ(`آلة ترفع حملاً وزنه ${Fr} N مسافة ${dr} m وكفاءتها ${e}%. شغل الجهد المبذول عليها`,W*100/e,[W,W*e/100,W*e],`W_out = ${Fr} × ${dr} = ${W} J، W_in = W_out ÷ الكفاءة = ${f(W*100/e)} J.`,'J')}
],
/* ===== 9 القدرة ===== */
s9:[
()=>{const W=R(2,20)*100,t=R(2,10);return GQ(`بُذل شغل ${W} J خلال ${t} s. القدرة`,W/t,[W*t,W+t,t/W],`P = W ÷ t = ${W} ÷ ${t} = ${f(W/t)} W.`,'W')},
()=>{const F=R(2,10)*1000,d=R(2,10),t=R(5,20);return GQ(`ترفع رافعة حملاً بقوة ${F} N مسافة ${d} m خلال ${t} s. القدرة`,F*d/t,[F*d*t,F*t/d,F/t],`P = Fd ÷ t = ${F*d} ÷ ${t} = ${f(F*d/t)} W.`,'W')},
()=>{const F=R(2,10)*100,v=R(2,20);return GQ(`تتحرك سيارة بسرعة ثابتة ${v} m/s ضد قوة مقاومة ${F} N. قدرة محركها`,F*v,[F/v,F+v,F*v*v],`P = Fv = ${F} × ${v} = ${F*v} W.`,'W')},
()=>{const P0=R(2,10)*100,t=R(2,10);return GQ(`محرك قدرته ${P0} W يعمل ${t} s. الشغل الذي يبذله`,P0*t,[P0/t,P0+t,P0*t*t],`W = Pt = ${P0} × ${t} = ${P0*t} J.`,'J')},
()=>{const W=R(2,10)*1000,P0=R(2,10)*100;return GQ(`ينجز محرك قدرته ${P0} W شغلاً مقداره ${W*P0/P0} J. الزمن اللازم`,W/P0,[W*P0,W/P0*2,W/(P0*P0)],`t = W ÷ P = ${W} ÷ ${P0} = ${f(W/P0)} s.`,'s')},

    if(l.p.length<=4)l.p.forEach(([x,y])=>{s+=`<circle cx="${X(x)}" cy="${Y(y)}" r="3.2" fill="${c}"/>`});
    if(l.n){const [x,y]=l.p[l.p.length-1];s+=`<text x="${X(x)-6}" y="${Y(y)-7}" font-size="14" font-weight="800" fill="${c}" text-anchor="end">${l.n}</text>`}
  });
  return s+'</svg>'}

/* ============ الجلسة ============ */
let S=null,tick=null;
const SEC=id=>SECTIONS.find(s=>s.id===id);
function bank(secId,mode){
  const sec=SEC(secId);
  if(mode==='train'||mode==='final')return sec.train;
  if(secId==='sc')return shuffle(['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11','s12','s13','s14'].flatMap(i=>SEC(i).quiz.map(x=>typeof x==='function'?x():x))).slice(0,10);
  return sec.quiz;}
function build(secId,mode,random){
  let b=bank(secId,mode);if(random)b=shuffle(b);
  return b.map(q=>{if(typeof q==='function')q=q();const idx=shuffle([0,1,2,3]);return{q:q.q,g:q.g,svg:q.svg,e:q.e,o:idx.map(i=>q.o[i]),c:idx.indexOf(0)}})}
function start(secId,mode,random){
  clearInterval(tick);
  const sec=SEC(secId);
  S={sec,mode,qs:build(secId,mode,random),i:0,ans:[],pts:[],t0:Date.now(),qs0:Date.now(),
     limit:mode==='quiz'?QUIZ_SECS:mode==='final'?FINAL_SECS:0,done:false};
  if(S.limit){tick=setInterval(onTick,1000)}
  renderQ(true);window.scrollTo(0,0)}
function onTick(){
  if(!S||S.done){clearInterval(tick);return}
  const left=S.limit-(Date.now()-S.t0)/1000,e=$('#timer');
  if(e){e.textContent=mmss(left);e.classList.toggle('low',left<=60)}
  if(left<=0){toast('انتهى الوقت — تم تسليم الاختبار');finish()}}

function bestOf(u,secId,mode){const r=u.results.filter(x=>x.sec===secId&&x.mode===mode);return r.length?Math.max(...r.map(x=>x.pct)):null}
function medalSvg(sz=22){return`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2l3 6h4l3-6" fill="none" stroke="#c0392b" stroke-width="2"/><circle cx="12" cy="15" r="6.5" fill="#f5b81c" stroke="#b97800" stroke-width="1.5"/><path d="M12 11.5l1.1 2.3 2.5.3-1.8 1.7.5 2.5-2.3-1.3-2.3 1.3.5-2.5-1.8-1.7 2.5-.3z" fill="#fff6dd"/></svg>`}
function pillFor(u,id,mode,label){const b=bestOf(u,id,mode);

/* ============ شاشة السؤال ============ */
function renderQ(animate){

    if(tr&&answered){cls+=' lock';if(i===q.c)cls+=' ok';else if(i===a)cls+=' no'}
    else if(!tr&&a===i)cls+=' sel';
    return`<button class="${cls}" data-a="pick" data-i="${i}"><span class="l">${LET[i]}</span><span>${fx(t)}</span></button>`}).join('');
  let fb='';
  if(tr&&answered){const ok=a===q.c;fb=`<div class="fb ${ok?'ok':'no'}"><b class="h">${ok?'إجابة صحيحة ✓ +'+S.pts[S.i]+' نقطة':'إجابة غير صحيحة ✗'}</b>${ok?'':'<div>الإجابة الصحيحة: <b>'+LET[q.c]+' — '+fx(q.o[q.c])+'</b></div>'}<div>${fx(q.e)}</div></div>`}

  if(tr)nav=`<div class="nav"><button class="btn sec sm" data-a="home">الرئيسية</button><button class="btn" data-a="next" ${answered?'':'disabled'}>${S.i===n-1?'عرض النتيجة':'السؤال التالي ←'}</button></div>`;
  else nav=`<div class="nav"><button class="btn sec" data-a="prev" ${S.i===0?'disabled':''}>→ السابق</button><button class="btn red sm" data-a="finish">إنهاء وتسليم</button><button class="btn" data-a="next" ${S.i===n-1?'disabled':''}>التالي ←</button></div>
    <div class="dots">${S.qs.map((_,i)=>`<button class="${i===S.i?'cur':S.ans[i]!==undefined?'done':''}" data-a="go2" data-i="${i}">${i+1}</button>`).join('')}</div>`;

    <div class="opts">${opts}</div>${fb}${nav}</div>`;
  if(tr&&!answered)S.qs0=Date.now()}

function pick(i){
  const q=S.qs[S.i];
  if(S.mode==='train'){
    if(S.ans[S.i]!==undefined)return;
    S.ans[S.i]=i;const sec=(Date.now()-S.qs0)/1000;
    S.pts[S.i]=i===q.c?10+Math.max(0,10-Math.floor(sec/3)):0;
  }else S.ans[S.i]=i;
  renderQ(false)}

/* ============ إنهاء الجلسة والنتيجة ============ */
function finish(){
  if(!S||S.done)return;

  const n=S.qs.length;let score=0;
  S.qs.forEach((q,i)=>{if(S.ans[i]===q.c)score++});
  const pts=S.mode==='train'?S.pts.reduce((x,y)=>x+(y||0),0):score*10;
  const pct=Math.round(score/n*100),secs=Math.round((Date.now()-S.t0)/1000);
  S.res={sec:S.sec.id,title:S.sec.short,mode:S.mode,score,total:n,pct,pts,secs,date:Date.now()};
  const u=user();u.results.push(S.res);save();viewResult()}
const kindName=m=>m==='train'?'تدريب':m==='quiz'?'اختبار قسم':'اختبار نهائي';

function showCert(){
  const u=user(),r=S.res;
  $('#cert').innerHTML=`<div class="certbox"><div class="certbar"><button class="btn amber" data-a="print">طباعة / حفظ PDF</button><button class="btn sec" data-a="closecert">إغلاق</button></div>
  <div class="cpage"><div style="font-size:.95rem;letter-spacing:.5px">${SCHOOL}</div>
    <h1>شهادة إنجاز</h1><p>تشهد منصة التحصيلي التفاعلية في الفيزياء بأن الطالب</p>
    <div><span class="nm">${esc(u.name)}</span></div>
    <p>قد أتمّ بنجاح <b>${kindName(r.mode)}</b> في <b>${esc(S.sec.title)}</b></p>
    <p>وحقّق درجة <b>${r.score} من ${r.total}</b> بنسبة <b>${r.pct}%</b>${r.pct>=80?' — بتقدير <b>متميّز</b>':r.pct>=60?' — بتقدير <b>جيّد</b>':''}</p>
    <p style="font-size:.95rem;color:#6b5a2c">التاريخ: ${dateAr(r.date)}</p>
    <div class="sig"><div>${TEACHER_TITLE}<br><b>${TEACHER}</b></div><div>${r.pct>=80?medalSvg(34):''}</div></div></div></div>`;
  $('#cert').className='show'}

/* ============ توزيع الأحداث ============ */
const A={
  open:d=>openStart(d.s,d.m),
  closeov:()=>{const o=$('#ov');o&&o.remove()},
  go:d=>{const r=$('#rnd')?$('#rnd').checked:false;A.closeov();start(d.s,d.m,r)},
  pick:d=>pick(+d.i),
  next:()=>{if(S.mode==='train'&&S.i===S.qs.length-1){finish();return}if(S.i<S.qs.length-1){S.i++;renderQ(true)}},
  prev:()=>{if(S.i>0){S.i--;renderQ(true)}},
  go2:d=>{S.i=+d.i;renderQ(true)},
  finish:()=>{const un=S.qs.length-S.ans.filter(x=>x!==undefined).length;
    if(un>0&&!confirm('لديك '+un+' سؤالاً بلا إجابة. هل تريد التسليم؟'))return;
    if(un===0&&!confirm('هل تريد تسليم الاختبار الآن؟'))return;finish()},
  home:()=>{if(S&&!S.done&&!confirm('سيتم الخروج دون حفظ هذه المحاولة. هل تريد المتابعة؟'))return;viewHome()},
  logout:()=>{db.cur=null;save();viewLogin()},
  reset:()=>{if(confirm('هل تريد مسح جميع نتائجك المحفوظة في هذا المتصفح؟')){user().results=[];save();viewHome()}},
  mail:()=>openMail(`نتيجة ${user().name} — ${S.sec.short} (${kindName(S.res.mode)})`,summaryText()),
  copy:()=>copyText(summaryText()),
  report:()=>openMail(`التقرير العام — ${user().name}`,reportText()),
  cert:showCert,
  print:()=>window.print(),
  closecert:()=>{$('#cert').className='';$('#cert').innerHTML=''},
  again:()=>openStart(S.sec.id,S.mode),
  rvall:()=>viewResultKeep(true),
  rverr:()=>viewResultKeep(false)
};
function viewResultKeep(all){const y=window.scrollY;viewResult(all);window.scrollTo(0,$('.rv').offsetTop-10)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=A[t.dataset.a];f&&f(t.dataset)});
document.addEventListener('keydown',e=>{
  if(!S||S.done||document.getElementById('ov')||e.target.tagName==='INPUT')return;
  const k=toEn(e.key);
  if(/^[1-4]$/.test(k)){pick(+k-1)}
  else if(e.key==='Enter'||e.key==='ArrowLeft'){const b=document.querySelector('[data-a="next"]');if(b&&!b.disabled)b.click()}
  else if(e.key==='ArrowRight'&&S.mode!=='train'){A.prev()}});
window.addEventListener('beforeunload',e=>{if(S&&!S.done){e.preventDefault();e.returnValue=''}});

/* بدء التشغيل */
user()?viewHome():viewLogin();
</script>
</body>
</html>
